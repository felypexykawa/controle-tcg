name: app-sintaxe
# TRAVA QUE VIAJA COM O REPOSITORIO (2026-08-18).
#
# POR QUE EXISTE: em 18/08 o app foi publicado com uma aspa mal escapada — o script inteiro
# morreu e o app ficou no ar sem funcionar. A checagem que pegaria isso ja existia dentro do
# publicar.sh, mas foi contornada por um commit feito na mao.
#
# A trava local (.git/hooks/pre-commit) resolve na maquina do Felype, mas NAO viaja: .git/hooks
# nao e versionado. Esta aqui viaja: roda no servidor do GitHub a cada push, em qualquer
# maquina, sem ninguem instalar nada — e pega inclusive quem usou `git commit --no-verify`.
#
# O QUE ELA NAO FAZ (limite honesto): ela nao IMPEDE a publicacao. O GitHub Pages serve o
# arquivo assim que o push chega, entao ela avisa em ~1 minuto, nao previne o minuto ruim.
# Prevenir e papel do hook local; esta e a rede que pega o que passou por fora dele.

on:
  push:
    paths:
      - 'index.html'
      - 'checks-app.js'
      - 'checks-suite.py'
      - 'testes-nucleo.js'
  workflow_dispatch:

jobs:
  sintaxe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # precisa do commit ANTERIOR pra conferir linha paralela

      - name: o app parseia E nao perdeu capacidade?
        run: node checks-app.js index.html

      # MESMA regra do pre-commit e do publicar.sh, aqui contra o commit ANTERIOR. E a unica
      # porta que pega quem escreveu DIRETO pela API do GitHub (sem commit local, sem hook) —
      # exatamente a rota do incidente de 20/08 23h30, quando 4 capacidades sumiram do ar.
      # Nao previne (o Pages ja serviu), mas grita em ~1 minuto em vez de dias.
      # Remocao proposital: escreva PODE_REMOVER=nomeA,nomeB no corpo da mensagem do commit.
      - name: alguma funcao sumiu em relacao ao commit anterior?
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            git show HEAD~1:index.html > /tmp/anterior.html 2>/dev/null || exit 0
            LIB=$(git log -1 --pretty=%B | sed -n 's/.*PODE_REMOVER=\([^ ]*\).*/\1/p')
            PODE_REMOVER="$LIB" node checks-app.js index.html --contra /tmp/anterior.html
          else
            echo "primeiro commit — sem versao anterior pra comparar"
          fi

      - name: as regras de negocio rodam de ponta a ponta?
        run: |
          if [ -f testes-nucleo.js ]; then node testes-nucleo.js index.html; else echo "sem testes-nucleo.js neste commit"; fi

      - name: a propria vacina esta provada? (mutacoes conhecidas + refatoracoes legitimas)
        run: python checks-suite.py

      - name: carimbo de versao bate nos dois lugares?
        run: |
          node -e "
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const tag=(h.match(/const BUILD_TAG='([^']*)'/)||[])[1];
          if(!tag){console.log('sem BUILD_TAG — pulando');process.exit(0);}
          let vj=null;try{vj=JSON.parse(fs.readFileSync('versao.json','utf8')).tag}catch(e){}
          if(vj&&tag!==vj){
            console.error('CARIMBO DIVERGENTE: index.html diz \"'+tag+'\" e versao.json diz \"'+vj+'\"');
            console.error('O aviso de \"versao nova\" do app compara exatamente esses dois — divergente, ele fica preso na tela pra sempre.');
            process.exit(1);}
          console.log('carimbo conferido: '+tag);
          "
