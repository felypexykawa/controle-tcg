function ligaVersoes(pl){if(!pl)return[];if(Array.isArray(pl.versoes)&&pl.versoes.length)return pl.versoes;if(pl.menor!=null)return[{v:'',mn:pl.menor,md:pl.medio||null,mx:pl.maior||null}];return[];}
function ligaHistDe(cod){if(!_precosLiga||!_precosLiga.historico)return null;
  const h=_precosLiga.historico[(''+cod).trim()]||_precosLiga.historico[codLimpo(cod)];if(!h)return null;
  return (typeof h==='object'&&!Array.isArray(h))?h:{'':h};}
function precosLigaQuando(){if(!_precosLiga||!_precosLiga.atualizadoEm)return '';const d=new Date(_precosLiga.atualizadoEm);const h=Math.round((Date.now()-d.getTime())/36e5);return h<1?'agora há pouco':h<48?('há '+h+'h'):d.toLocaleDateString('pt-BR');}
function ligaHint(cod,elId){const el=document.getElementById(elId);if(!el)return;const pl=precoLigaDe(cod);const vs=ligaVersoes(pl);
  if(pl&&pl.status==='AMBIGUO'){const codC=codLimpo(cod),resolv=codigosResolvidos[codC];
    el.innerHTML='🔍 Liga: '+(resolv?'código resolvido ✓':'mais de uma carta com esse código')+' <span class="lnk" style="font-size:11px;padding:1px 4px" onclick="abrirEscolhaAmbigua(\''+codC.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\')">'+(resolv?'trocar':((pl.opcoes&&pl.opcoes.length)?'escolher qual →':'colar link →'))+'</span>';return;}
  el.innerHTML=pl?(vs.length?'🔍 Liga: <b>'+pl.titulo.split(' (')[0]+'</b> · menor '+fmt(vs[0].mn)+(vs[0].v?' ('+vs[0].v+')':'')+' <span style="color:var(--mut)">('+precosLigaQuando()+')</span>':''):'';}
/* PENDÊNCIA 5 — carta avulsa que você ainda tem (estoque, pedido ou coleção) e da qual o app
   não consegue puxar preço.
   [CORRIGIDO 2026-08-17 — 28 falsos alarmes na cara do Felype, achado dele]
   A 1ª versão tentava ADIVINHAR se o código estava "cortado", comparando com um formato que
   eu inventei (número/número). Errado na raiz: o Pokémon tem dezenas de formatos legítimos
   com letra — Trainer Gallery (TG12/TG30), Galarian Gallery (GG01/GG70), Shiny Vault
   (SV49/SV94), sets antigos (H1/H32) — e One Piece/Yu-Gi-Oh têm os seus próprios, que nem
   estudamos ainda. Qualquer régua de formato que eu escreva vai reprovar carta certa. Além
   disso o ♾️ do teclado do celular também caía aqui (agora normalizado em normCod).
   REGRA NOVA, sem adivinhação: só aponto o que é FATO verificável —
     (a) não tem código nenhum, nem link, nem resolução salva → não há como buscar preço;
     (b) tem código, mas a Liga não devolve preço pra ele → ou o código está errado, ou a
         coleta ainda não passou nessa carta. Os dois casos são acionáveis e honestos.
   Nunca mais julgo "formato estranho". */
function pendenciasCodigo(){
  return movs.filter(m=>m.tipo==='COMPRA'&&m.cat==='Single/Carta'&&(+m.qtd||1)>0&&['Em estoque','Pedido','Coleção'].includes(sitDe(m)))
    .map(m=>{
      if(m.codigoUrl)return null;
      const cod=normCod(m.codigo),codC=cod?codLimpo(cod):'';
      if(codC&&codigosResolvidos[codC])return null;
      if(!cod)return {m,motivo:'sem_codigo',cod};
      const pl=precoLigaDe(cod);
      if(pl&&pl.status!=='AMBIGUO'&&ligaVersoes(pl).length)return null;   // tem preço: nada a fazer
      if(pl&&pl.status==='AMBIGUO')return null;                            // ambíguo tem picker próprio
      return {m,motivo:'sem_preco',cod};
    }).filter(Boolean);
}
function abrirCorrigirCodigo(id){consVer='itens';verMov(id);}
function abrirPendenciasCodigo(){const P=pendenciasCodigo();
  const MOT={sem_preco:['🟡','tem código, mas a Liga não devolveu preço — ou o código está diferente do dela, ou a coleta ainda não passou nessa carta'],sem_codigo:['ℹ️','sem código e sem link — não há por onde buscar preço']};
  const ST2={'Em estoque':['c','📦 estoque'],'Pedido':['c','🚚 pedido'],'Coleção':['k','⭐ coleção']};
  const bloco=mot=>{const its=P.filter(x=>x.motivo===mot);if(!its.length)return '';
    return `<div class="sec">${MOT[mot][0]} ${MOT[mot][1]} (${its.length})</div>`+its.map(x=>{
      const m=x.m,rot=m.obs||((m.colecao?m.colecao+' · ':'')+(m.cat||'Single/Carta')),st=ST2[sitDe(m)]||['c',sitDe(m)];
      return `<div class="item" style="display:block;padding:10px 12px"><b>${rot}</b> <span class="tag ${st[0]}">${st[1]}</span>${x.cod?` <span class="meta">código atual: <b>${x.cod}</b></span>`:''}<div class="meta" style="margin-top:3px">${fmt(+m.valor||0)}${m.contraparte?' · '+m.contraparte:''}${m.data?' · '+dBR(new Date(m.data+'T00:00:00')):''}</div><div style="margin-top:5px;display:flex;gap:14px"><span class="lnk" onclick="abrirCorrigirCodigo('${m.id}')">→ ver na lista</span><span class="lnk" onclick="fecharModal();abrir('${m.id}')">✏️ editar direto</span></div></div>`;
    }).join('');};
  const hh=`<div id="modal" onclick="if(event.target.id==='modal')fecharModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end"><div style="background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto">
    <div class="sec" style="margin-top:0">🏷️ Pendências de cadastro — código da carta</div>
    <div class="ctx">${P.length?`<b>${P.length} carta${P.length>1?'s':''}</b> em estoque, pedido ou coleção sem preço da Liga hoje. <b>Não estou julgando o formato do seu código</b> — só listo o que de fato não trouxe preço. Produto selado nunca entra aqui: só carta avulsa (Single/Carta). Se a coleta ainda não rodou depois do cadastro, é normal aparecer aqui e sumir na próxima rodada do robô${precosLigaQuando()?' (última coleta '+precosLigaQuando()+')':''}.`:'<b>Tudo certo ✓</b> — toda carta avulsa que você ainda tem já tem preço da Liga, link direto ou está resolvida.'}</div>
    ${bloco('sem_preco')}${bloco('sem_codigo')}
    <button class="btn g" style="margin-top:12px" onclick="fecharModal()">fechar</button></div></div>`;
  document.getElementById('modal')?.remove();document.body.insertAdjacentHTML('beforeend',hh);}
/* Assist de preço p/ campos "vale (mercado)" — nunca mexe em "valor" de compra/venda
   (isso é o que você pagou/recebeu, não o preço da Liga). Preenche NOME e VALE só se
   estiverem vazios (não sobrescreve o que você já digitou); dispara junto de digitar
   o código, sem esperar salvar. Só funciona pra código já coletado (precos.json) —
   código novo segue precisando do "🔎 preço Liga" manual. */
function assistCod(codId,descId,valId,hintId){const cod=(document.getElementById(codId)?.value||'').trim();
  const hintEl=document.getElementById(hintId);const pl=precoLigaDe(cod);
  if(!pl){if(hintEl)hintEl.innerHTML='';return;}
  if(pl.status==='AMBIGUO'){const codC=codLimpo(cod),resolv=codigosResolvidos[codC];
    if(hintEl)hintEl.innerHTML='🔍 Liga: '+(resolv?'código resolvido ✓ (não preenchi automático — confira antes de salvar)':'código com mais de uma carta — confira o nome certo antes de salvar (não preenchi sozinho)')+' <span class="lnk" style="font-size:11px;padding:1px 4px" onclick="abrirEscolhaAmbigua(\''+codC.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')+'\')">'+(resolv?'trocar':((pl.opcoes&&pl.opcoes.length)?'escolher qual →':'colar link →'))+'</span>';return;}
  const vs=ligaVersoes(pl),nome=pl.titulo.split(' (')[0];
  const descEl=document.getElementById(descId),valEl=document.getElementById(valId);const feito=[];
  if(descEl&&!descEl.value.trim()){descEl.value=nome;feito.push('nome');}
  if(valEl&&(!valEl.value||+valEl.value===0)&&vs.length){const sug=vs[0].md!=null?vs[0].md:vs[0].mn;valEl.value=sug;feito.push('valor');}
  if(hintEl)hintEl.innerHTML='🔍 Liga: <b>'+nome+'</b>'+(vs.length?' · sugestão '+fmt(vs[0].md!=null?vs[0].md:vs[0].mn):'')+(feito.length?` <span style="color:var(--green)">— preenchi ${feito.join(' e ')} ✓ (pode ajustar)</span>`:'');}
/* Link direto da Liga — resolve código ambíguo (60 cartas com o mesmo número) e produto selado:
   você cola 1x o link da página certa; a rotina passa a coletar direto nela */
function setCodigoUrl(id){const m=movs.find(x=>x.id===id);if(!m)return;
  const atual=m.codigoUrl||'';
  const u=prompt('Cole o LINK da página certa na Liga: busque em ligapokemon.com.br por "Nome (código)" — ex. Pikachu (173/165) — ou só o nome se não tiver código; abra a carta certa e copie o endereço:',atual);
  if(u===null)return;
  const url=(u||'').trim();
  if(!url){if(atual&&confirm('Remover o link direto deste item?')){delete m.codigoUrl;save();toast('Link removido');render();}return;}
  if(!/^https:\/\/(www\.)?ligapokemon\.com\.br\//i.test(url)){alert('Esse link não é da ligapokemon.com.br — cole o endereço da página da carta/produto na Liga.');return;}
  m.codigoUrl=url;save();toast('🔗 Link direto salvo — a próxima coleta busca nessa página');render();}
/* FASE 3 do preço ambíguo ("padrão Janet", pedido 2026-07-04, executado 2026-08-10):
   quando a rotina já capturou as opções da página "Busca:" (precos.json ganha `opcoes`
   por código — nome/link/miniatura de cada carta candidata), mostra elas aqui pra
   escolha visual em 1 toque. A escolha é POR CÓDIGO (codigosResolvidos), não por item —
   resolve UMA vez e vale pra todo item atual e futuro com esse código. Enquanto a rotina
   ainda não populou `opcoes` (código descoberto ambíguo mas coleta ainda não rodou de
   novo), cai no fallback manual de sempre (link colado à mão). */
function abrirEscolhaAmbigua(codigo){
  /* BUG CORRIGIDO 2026-08-12 (Felype mandou o print: clicava em "escolher carta" e vinha o
     pedido de colar link à mão). Causa: buscava SÓ pelo código limpo ("211/172"), mas a coleta
     grava a entrada sob o código como está no cadastro ("Charizard (211/172)"). Não achava as
     opções e caía no fallback manual. precoLigaDe() já tenta chave exata E depois a limpa —
     então basta passar o código ORIGINAL primeiro. Vale pros dois formatos de cadastro. */
  const codC=codLimpo(codigo);const pl=precoLigaDe(codigo)||precoLigaDe(codC);
  const ops=(pl&&Array.isArray(pl.opcoes))?pl.opcoes:[];
  if(!ops.length){setCodigoUrlGlobal(codC);return;}
  const esc=s=>(''+(s||'')).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  const linhas=ops.map(o=>`<div class="item" style="cursor:pointer;align-items:center;gap:10px" onclick="escolherOpcaoAmbigua('${esc(codC)}','${esc(o.url)}')">
    ${o.img?`<img src="${esc(o.img)}" style="width:44px;height:44px;object-fit:contain;border-radius:6px;background:var(--card2);flex:none" onerror="this.style.display='none'">`:`<div style="width:44px;height:44px;border-radius:6px;background:var(--card2);flex:none"></div>`}
    <div style="flex:1"><b>${(o.titulo||'—').replace(/&/g,'&amp;').replace(/</g,'&lt;')}</b></div>
    <span style="color:var(--blue);font-size:12px;flex:none">escolher →</span></div>`).join('');
  const hh=`<div id="modal" onclick="if(event.target.id==='modal')fecharModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end"><div style="background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:80vh;overflow:auto">
    <div class="sec" style="margin-top:0">🔍 Código ${codC.replace(/</g,'&lt;')} tem ${ops.length} cartas — qual é a sua?</div>
    <div class="ctx" style="margin-bottom:8px">Escolha 1x — as próximas coletas de TODOS os itens com esse código vão direto nessa carta.</div>
    ${linhas}
    <button class="btn g" style="margin-top:12px" onclick="fecharModal()">cancelar</button>
    <div class="lnk" style="margin-top:8px;font-size:12px" onclick="fecharModal();setCodigoUrlGlobal('${esc(codC)}')">✎ nenhuma dessas — colar link manualmente</div>
    </div></div>`;
  document.getElementById('modal')?.remove();document.body.insertAdjacentHTML('beforeend',hh);}
function escolherOpcaoAmbigua(codC,url){
  if(!url){toast('Essa opção não tem link salvo — tente colar manualmente.');return;}
  codigosResolvidos[codC]=url;salvarCodRes();save();fecharModal();toast('🔗 Escolhido — as próximas coletas desse código vão direto ✓');render();}
function setCodigoUrlGlobal(codC){
  const atual=codigosResolvidos[codC]||'';
  const u=prompt('Cole o LINK da página certa na Liga pro código '+codC+' — vale pra TODOS os itens com esse código, atuais e futuros:',atual);
  if(u===null)return;
  const url=(u||'').trim();
  if(!url){if(atual&&confirm('Remover o link resolvido deste código?')){delete codigosResolvidos[codC];salvarCodRes();save();toast('Link removido');render();}return;}
  if(!/^https:\/\/(www\.)?ligapokemon\.com\.br\//i.test(url)){alert('Esse link não é da ligapokemon.com.br — cole o endereço da página da carta/produto na Liga.');return;}
  codigosResolvidos[codC]=url;salvarCodRes();save();toast('🔗 Link salvo pro código — a próxima coleta busca nessa página ✓');render();}
/* Gráfico de evolução do preço (historico do precos.json) — menor/médio/maior no tempo */
function graficoLiga(cod){const pl=precoLigaDe(cod),hist=ligaHistDe(cod);if(!hist){toast('Sem histórico ainda pra esse código');return;}
  const vers=Object.keys(hist).filter(v=>Array.isArray(hist[v])&&hist[v].length);if(!vers.length){toast('Sem histórico ainda pra esse código');return;}
  if(!vers.includes(_glVer))_glVer=vers[0];
  const pts=hist[_glVer];
  const tabs=vers.length>1?`<div class="seg" style="margin-bottom:8px">${vers.map(v=>`<button class="${_glVer===v?'on':''}" onclick="_glVer='${v.replace(/'/g,"\\'")}';graficoLiga('${(''+cod).replace(/'/g,"\\'")}')">${v||'única'}</button>`).join('')}</div>`:'';
  const W=340,H=170,PL=44,PR=8,PT=12,PB=26,iw=W-PL-PR,ih=H-PT-PB;
  const series=[['mn','menor','var(--green)'],['md','médio','var(--blue)'],['mx','maior','var(--amber)']];
  const todos=pts.flatMap(p=>series.map(([k])=>p[k]).filter(v=>v!=null&&isFinite(v)));
  let lo=Math.min(...todos),hi=Math.max(...todos);if(!isFinite(lo)){toast('Histórico sem valores');return;}
  if(hi-lo<hi*0.05){const pad=Math.max(hi*0.05,1);lo=Math.max(0,lo-pad);hi=hi+pad;}
  const X=i=>pts.length===1?PL+iw/2:PL+iw*i/(pts.length-1);
  const Y=v=>PT+ih-(ih*(v-lo)/((hi-lo)||1));
  const linha=(k,cor)=>{const seg=pts.map((p,i)=>p[k]!=null?[X(i),Y(p[k])]:null);
    const poly=seg.filter(Boolean).length>1?`<polyline fill="none" stroke="${cor}" stroke-width="2" points="${seg.filter(Boolean).map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ')}"/>`:'';
    return poly+seg.map((c,i)=>c?`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="${cor}"><title>${dBR(new Date(pts[i].d+'T00:00:00'))} · ${fmt(pts[i][k])}</title></circle>`:'').join('');};
  const dRot=s=>s.slice(8,10)+'/'+s.slice(5,7);
  const eixoX=pts.length===1?`<text x="${X(0)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--mut)">${dRot(pts[0].d)}</text>`
    :`<text x="${PL}" y="${H-8}" text-anchor="start" font-size="9" fill="var(--mut)">${dRot(pts[0].d)}</text><text x="${W-PR}" y="${H-8}" text-anchor="end" font-size="9" fill="var(--mut)">${dRot(pts[pts.length-1].d)}</text>`;
  const eixoY=`<text x="${PL-4}" y="${Y(hi)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${fmt(hi)}</text><text x="${PL-4}" y="${Y(lo)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${fmt(lo)}</text>`;
  const leg=series.filter(([k])=>pts.some(p=>p[k]!=null)).map(([k,n,c])=>`<span style="color:${c};font-size:11px;font-weight:700">● ${n}</span>`).join(' &nbsp; ');
  const base=pts[0];
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--card2);border-radius:10px">${eixoY}${eixoX}${series.map(([k,,c])=>linha(k,c)).join('')}</svg>`;
  const old=document.getElementById('modal');if(old)old.remove();
  document.body.insertAdjacentHTML('beforeend',`<div id="modal" onclick="if(event.target.id==='modal')fecharModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end"><div style="background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto">
    <div class="sec" style="margin-top:0">📈 Evolução na Liga — ${pl&&pl.titulo?pl.titulo.split(' | ')[0]:cod}</div>
    ${tabs}${svg}
    <div style="display:flex;justify-content:center;gap:6px;margin-top:8px">${leg}</div>
    <div class="meta" style="margin-top:8px">1ª conferência (guardada pra sempre): ${dRot(base.d)} — menor ${fmt(base.mn)}${base.md!=null?' · médio '+fmt(base.md):''}${base.mx!=null?' · maior '+fmt(base.mx):''}</div>
    ${pts.length<3?`<div class="meta" style="margin-top:4px">Histórico começando — a rotina adiciona um ponto a cada coleta (de 4 em 4 dias).</div>`:''}
    <button class="btn g" style="margin-top:12px" onclick="fecharModal()">fechar</button></div></div>`);}
if(USAR_NUVEM){bootNuvem();}
else{if(!localStorage.getItem('tcg_seed_v1')&&Array.isArray(SEED)&&SEED.length){movs=SEED.map(m=>({...m}));save();localStorage.setItem('tcg_seed_v1','1');}render();}
</script>
