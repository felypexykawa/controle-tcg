/* Projeção do caixa: parte do dinheiro FÍSICO de hoje e aplica o que entra/sai até +N dias.
   saldoConta usa a convenção "por emissão" (venda App conta na emissão; compra parcelada
   desconta inteira) — pro caixa físico: devolve as parcelas de COMPRA ainda não pagas e
   tira as vendas ainda não recebidas. Sem isso a projeção contava esses valores em dobro. */
/* Dinheiro pago ALÉM do plano que o VALOR da compra não cobre (19/09/2026, auditorias do M-1).
   A Projeção do caixa parte do saldo "por emissão" (a compra parcelada já saiu inteira, pelo valor) e soma o que ainda vai
   vencer — conta que só fecha quando (total pago + o que falta) = valor da compra. Marca além do plano por sobra de editar
   o nº de parcelas costuma FECHAR essa conta (4× virou 3× com as 4 pagas: o valor é o mesmo) e não muda nada aqui; só quando
   o total passa do valor (ex.: valor corrigido pra baixo depois de pagar) sobra dinheiro que saiu e o valor da compra não
   enxerga — é esse excedente que sai da projeção, pra ela bater com o saldo físico.
   ESCOPO (3ª auditoria, revisor de números — dois revisores acharam o mesmo furo): o que decide se uma parcela além do plano
   saiu do saldo físico é a MARCA (conta de quem pagou + data do pagamento — marcaEntraNoSaldo, o mesmo critério do
   saldoFisicoConta), não a compra. Compra fora do saldo por emissão (conta não cadastrada ou anterior à data-base) mas com
   pagamento que o saldo físico debitou: o excedente é tudo o que passou do plano; compra dentro do saldo por emissão: só o
   que o valor da compra não cobre. Global (a projeção é a soma de todas as contas). */
function excessoPagoAlemDoPlano(){
  /* Uma passada só por movs (grupos por nota num Map: sem chave herdada de Object.prototype e sem varrer movs de novo a cada nota). */
  const notas=new Map(),grupos=[];
  movs.forEach(x=>{
    if(x.tipo!=='COMPRA'||x.origem||x.pgTipo!=='Parcelado'||!(+x.nParc>0))return;
    if(x.notaId){if(!notas.has(x.notaId)){const g=[];notas.set(x.notaId,g);grupos.push(g);}notas.get(x.notaId).push(x);}
    else grupos.push([x]);});
  let exc=0;
  grupos.forEach(its=>{
    const h=its[0],nP=+h.nParc||1,pg=h.pgParcelas;
    /* cada marca pesa por QUANTOS cadastros de conta a debitam (1; 2 se houver dois cadastros com o mesmo nome) */
    const ex=parcelasAlemDoPlano(pg,nP).map(e=>({e,n:marcaEntraNoSaldo(h,e.k,e.p)})).filter(x=>x.n>0);if(!ex.length)return;
    const V=its.reduce((a,x)=>a+(+x.valor||0),0),vP=V/nP;
    const extras=ex.reduce((a,x)=>a+x.n*pgValor(x.e.p,vP),0);
    /* a compra entrou no saldo "por emissão" (saldoConta: conta cadastrada e data não anterior à data-base)? em quantos cadastros */
    const nE=contasBanc.filter(c=>c.nome===(h.conta||'')&&!(c.saldoData&&(h.data||'')<c.saldoData)).length;
    if(!nE){exc+=extras;return;}
    let plano=0;for(let i=1;i<=nP;i++)plano+=(pg&&pg[i])?pgValor(pg[i],vP):vP;
    exc+=Math.max(0,extras-nE*Math.max(0,V-plano));});
  return Math.round(exc*100)/100;}
function projecaoCaixa(){const hoje=new Date();hoje.setHours(0,0,0,0);
  const porEmissao=contasBanc.reduce((s,cb)=>s+saldoConta(cb),0);
  const ap=aPagar(),ar=aReceber();
  const pendCompra=ap.filter(x=>x.m&&x.m.tipo==='COMPRA').reduce((s,x)=>s+x.valor,0);
  const pendReceber=ar.reduce((s,x)=>s+x.valor,0);
  const fisico=Math.round((porEmissao+pendCompra-pendReceber-excessoPagoAlemDoPlano())*100)/100;
  const em=d=>{const lim=new Date(hoje);lim.setDate(lim.getDate()+d);
    const p=ap.filter(x=>(x.venc||x.data)<=lim).reduce((s,x)=>s+x.valor,0);
    const r=ar.filter(x=>(x.venc||x.data)<=lim).reduce((s,x)=>s+x.valor,0);
    return Math.round((fisico+r-p)*100)/100;};
  const dt=d=>{const x=new Date(hoje);x.setDate(x.getDate()+d);return x.toLocaleDateString('pt-BR').slice(0,5);};
  return {atual:fisico,d30:em(30),d60:em(60),d90:em(90),dt30:dt(30),dt60:dt(60),dt90:dt(90),temContas:contasBanc.length>0};}

   baixa na primeira vez que alguém escaneia; depois fica no cache do navegador. */

  _ocrCarregando=true;
  const s=document.createElement('script');s.src='ocr/tesseract.min.js';
  s.onload=async()=>{try{

    const w=await Tesseract.createWorker('eng',2,{workerPath:base+'/worker.min.js',corePath:base,langPath:base+'/lang'});
    _ocrWorker=w;_ocrCarregando=false;cb(w);
  }catch(e){_ocrCarregando=false;alert('Não consegui ligar o leitor de cartas: '+(String((e&&e.message)||e)).slice(0,80));cb(null);}};
  s.onerror=()=>{_ocrCarregando=false;alert('Não consegui baixar o leitor (ocr/). Confere a internet e tenta de novo.');cb(null);};
  document.head.appendChild(s);}

  const linha=(k,cor)=>{const seg=pts.map((p,i)=>p[k]!=null?[X(i),Y(p[k])]:null);
    const poly=seg.filter(Boolean).length>1?`<polyline fill="none" stroke="${cor}" stroke-width="2" points="${seg.filter(Boolean).map(c=>c[0].toFixed(1)+','+c[1].toFixed(1)).join(' ')}"/>`:'';
    return poly+seg.map((c,i)=>c?`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="${cor}"><title>${dBR(new Date(pts[i].d+'T00:00:00'))} · ${fmt(pts[i][k])}</title></circle>`:'').join('');};
  const dRot=s=>s.slice(8,10)+'/'+s.slice(5,7);
  const eixoX=pts.length===1?`<text x="${X(0)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--mut)">${dRot(pts[0].d)}</text>`
    :`<text x="${PL}" y="${H-8}" text-anchor="start" font-size="9" fill="var(--mut)">${dRot(pts[0].d)}</text><text x="${W-PR}" y="${H-8}" text-anchor="end" font-size="9" fill="var(--mut)">${dRot(pts[pts.length-1].d)}</text>`;
  const eixoY=`<text x="${PL-4}" y="${Y(hi)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${fmt(hi)}</text><text x="${PL-4}" y="${Y(lo)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${fmt(lo)}</text>`;
  const leg=series.filter(([k])=>pts.some(p=>p[k]!=null)).map(([k,n,c])=>`<span style="color:${c};font-size:11px;font-weight:700">● ${n}</span>`).join(' &nbsp; ');
  const base=pts[0];
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--card2);border-radius:10px">${eixoY}${eixoX}${series.map(([k,,c])=>linha(k,c)).join('')}</svg>`;
  const old=document.getElementById('modal');if(old)old.remove();
  document.body.insertAdjacentHTML('beforeend',`<div id="modal" onclick="if(event.target.id==='modal')fecharModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end"><div style="background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto">
    <div class="sec" style="margin-top:0">📈 Evolução na Liga — ${pl&&pl.titulo?pl.titulo.split(' | ')[0]:cod}</div>
    ${tabs}${svg}
    <div style="display:flex;justify-content:center;gap:6px;margin-top:8px">${leg}</div>
    <div class="meta" style="margin-top:8px">1ª conferência (guardada pra sempre): ${dRot(base.d)} — menor ${fmt(base.mn)}${base.md!=null?' · médio '+fmt(base.md):''}${base.mx!=null?' · maior '+fmt(base.mx):''}</div>
    ${pts.length<3?`<div class="meta" style="margin-top:4px">Histórico começando — a rotina adiciona um ponto a cada coleta (de 4 em 4 dias).</div>`:''}
    <button class="btn g" style="margin-top:12px" onclick="fecharModal()">fechar</button></div></div>`);}
/* [re-checagem 2, N4] primeiro boot depois da atualização, sem base no disco e SEM pendência: tudo que está
   aqui já foi confirmado pela nuvem em algum momento — grava a base do próprio estado local e fecha a
   janela "sem base" (onde a troca feita sem rede rasgava). Com pendência, não: o estado local tem coisa
   que a nuvem nunca viu, e a base nasce no próximo commit. */
if(USAR_NUVEM&&!Object.keys(_baseH).length&&!pendNuvem()){try{gravaBaseConfirmada({movs,cadastros,contasBanc});}catch(e){}}
if(USAR_NUVEM){bootNuvem();}
else{if(!localStorage.getItem('tcg_seed_v1')&&Array.isArray(SEED)&&SEED.length){movs=SEED.map(m=>({...m}));save();localStorage.setItem('tcg_seed_v1','1');}render();}
</script>
