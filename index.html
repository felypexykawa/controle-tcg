function vinculoInfoVenda(m){const alvo=movs.find(x=>x.id===m.origemId);

function desvincular(id){const v=movs.find(x=>x.id===id);if(!v||!v.origemId)return;
  const alvo=movs.find(x=>x.id===v.origemId);
  const limpa=()=>{delete v.origemId;delete v.custoOrigem;delete v.vendaDe;delete v.semOrigem;if(alvo&&alvo.vendaRef===v.id)delete alvo.vendaRef;save();toast('✂ Vínculo desfeito ✓');render();};
  if(!alvo){if(confirm('O item de origem não existe mais. Limpar só a referência desta venda? (nada mais muda)'))limpa();return;}
  /* dois formatos de vínculo convivem: retroativo aponta pro pedaço Vendido; venda criada
     já vinculada aponta pro lote-PAI (o pedaço é um irmão com loteOrigem) — achar o certo */
  let peca=null;
  if(sitDe(alvo)==='Vendido')peca=alvo;
  else{const cands=movs.filter(x=>x.loteOrigem===alvo.id&&sitDe(x)==='Vendido'&&x.dataVenda===v.data&&(+x.qtd||1)===(+v.qtd||1)&&Math.abs((+x.valor||0)-(+v.custoOrigem||0))<0.02&&!movs.some(o=>o.tipo==='VENDA'&&o.origemId===x.id));
    if(cands.length)peca=cands[0];}
  if(!peca){alert('Não achei o pedaço vendido correspondente (o item de origem está "'+sitDe(alvo)+'" e nenhum pedaço bate com esta venda). Se algo foi mexido depois do vínculo, corrija o item primeiro.');return;}
  const volta=v.vendaTipo==='colecao'?'Coleção':(v.vendaDe==='pedido'?'Pedido':'Em estoque');

  if(!confirm('Desfazer o vínculo?\n\n"'+rot+'" (custo '+fmt(+peca.valor||0)+') volta pra '+voltaRot+' como estava. A venda continua registrada, só perde o lucro calculado. Nada é apagado.'))return;
  peca.situacao=volta;peca.destino=volta==='Coleção'?'Coleção':'Vender';
  delete peca.dataVenda;delete peca.dataSaida;delete peca.vendaRef;limpa();}
/* Detector de origem: pra venda sem vínculo, acha o pedaço Vendido ÓRFÃO que bate por
   data/quantidade — transforma "provável" em verificável com 1 toque. NÃO baixa nada
   (a baixa já aconteceu quando o material saiu); só reconecta os dois registros. */
function fragOrfao(x){if(x.tipo!=='COMPRA'||sitDe(x)!=='Vendido')return false;
  if(movs.some(v=>v.tipo==='VENDA'&&v.origemId===x.id))return false;
  if(x.vendaRef&&movs.some(v=>v.id===x.vendaRef))return false; /* dono gravado na criação (determinístico) */
  /* legado sem vendaRef: se o nº de vendas apontando pro PAI cobre o nº de pedaços Vendido,
     todo pedaço tem candidato a dono (mesmo que edição tenha quebrado data/qtd) — não é órfão.
     Comparar por heurística de data/qtd aqui gerava falso-órfão e custo DUPLICADO. */
  if(x.loteOrigem){
    const vendasPai=movs.filter(v=>v.tipo==='VENDA'&&v.origemId===x.loteOrigem).length;
    const pedacosVend=movs.filter(y=>y.tipo==='COMPRA'&&y.loteOrigem===x.loteOrigem&&sitDe(y)==='Vendido'&&!y.vendaRef&&!movs.some(v=>v.tipo==='VENDA'&&v.origemId===y.id)).length;
    if(vendasPai>=pedacosVend)return false;}
  return true;}
function procurarOrigem(vendaId){const v=movs.find(x=>x.id===vendaId);if(!v||v.origemId)return;

  let cands=movs.filter(x=>fragOrfao(x)&&mesmoJogo(x)&&x.dataVenda===v.data&&(+x.qtd||1)===(+v.qtd||1));

  if(!cands.length){cands=movs.filter(x=>fragOrfao(x)&&mesmoJogo(x)&&x.dataVenda===v.data);criterio='mesma data (quantidade diferente — o custo será proporcional)';}
  if(!cands.length){cands=movs.filter(x=>fragOrfao(x)&&mesmoJogo(x)&&!x.dataVenda);criterio='marcado como vendido SEM data de saída registrada — confira com cuidado';}

function aplicarOrigem(vendaId,fragId){const v=movs.find(x=>x.id===vendaId),f=movs.find(x=>x.id===fragId);if(!v||!f)return;

/* O LOTE inteiro (o "inteiro e o picado"): da raiz da compra, todos os pedaços e o destino
   de cada um — mata a confusão "só vejo o picado, cadê a compra original?". */
/* DIAGNÓSTICO DE LOTE COM CONTA QUEBRADA (Felype 2026-08-12).
   Antes: a prova real dizia "a soma dos pedaços difere do valor original" e parava aí — ele leu
   e me perguntou "que pedaços? onde está o erro?". Aviso que acusa e não mostra o culpado obriga
   o dono a virar detetive do próprio app.
   Caso real que originou (ABBYs eyes · Booster Box): uma caixa de OUTRA nota (R$739,50, nota
   própria com "0 produtos") estava grudada como pedaço do lote de 2 caixas. Efeitos em cascata:
   o app dividia o valor da nota de 2 caixas por 3 partes (lacradas com R$985,99, boosters com
   R$493,00) e a intrusa aparecia como "saiu em troca" sem nenhuma troca ter existido.
   COMO ACHA O CULPADO: procura UM pedaço cuja retirada faz a soma bater com o valor original.
   Se existe e ele tem nota própria / não tem venda ligada / não tem filhos, é intruso — entrou
   por engano. Prova no caso real: 985,99 + 197,20 + 295,80 = 1.478,99 exato. */
function diagLote(raizId){
  const raiz=movs.find(x=>x.id===raizId); if(!raiz) return null;
  const fam=movs.filter(x=>x.tipo==='COMPRA'&&(raizDe(x)||x).id===raizId);
  const ref=raiz.valorOrig!=null?Math.round((+raiz.valorOrig)*100)/100:null;
  if(ref==null||fam.length<2) return null;
  /* [CORRIGIDO 2026-08-13] a soma daqui divergia da regra que a prova real e o "aceitar
     referência" já usavam: caixa ABERTA cujo valor foi redistribuído nos pedaços (filhos de
     abertura) não pode contar de novo — contar os dois é dupla contagem e gerava alarme
     falso neste diagnóstico depois de uma correção de "mesma compra". Mesma exclusão das
     linhas irmãs (provaReal/aceitarConservacao). */
  const filhosD=new Map();movs.forEach(m=>{if(m.tipo==='COMPRA'&&m.loteOrigem){if(!filhosD.has(m.loteOrigem))filhosD.set(m.loteOrigem,[]);filhosD.get(m.loteOrigem).push(m);}});
  const soma=Math.round(fam.reduce((s,x)=>{const rd=sitDe(x)==='Aberto'&&(filhosD.get(x.id)||[]).some(f=>f.origem==='ABERTURA');return rd?s:s+(+x.valor||0);},0)*100)/100;
  if(Math.abs(soma-ref)<=0.02) return null;                       // conta fecha, nada a diagnosticar
  const suspeitas=fam.filter(x=>x.id!==raizId).filter(x=>
    Math.abs(Math.round((soma-(+x.valor||0))*100)/100-ref)<=0.02  // tirando ela, fecha
    && !movs.some(v=>v.tipo==='VENDA'&&v.origemId===x.id)         // sem venda pendurada
    && !movs.some(y=>y.loteOrigem===x.id));                       // sem pedaços próprios
  return {raiz,fam,ref,soma,dif:Math.round((soma-ref)*100)/100,intrusa:suspeitas.length===1?suspeitas[0]:null,ambiguo:suspeitas.length>1};
}
/* HISTÓRICO 2026-08-12, mesmo dia: nasceu simples (só solta a intrusa). Ganhou depois um recurso
   pra "levar os pedaços que saíram dela" — pareceu resolver o caso real do Felype (12+18 boosters
   presos na nota errada), mas o TESTE ISOLADO (fixture sintético, sem tocar dado real — depois do
   susto de mais cedo, testar contra o app aberto está proibido) revelou que a correção era falsa:
   mover os pedaços sem REDISTRIBUIR o valor deles cria uma conta que fecha no papel mas continua
   com números errados dentro — maquiagem, não conserto. Redistribuir valor de verdade precisa do
   preço por unidade da nota CERTA, que é um trabalho à parte, com mais cuidado, não escondido
   dentro de um botão de "soltar". Revertido pra versão simples e PROVADA: 985,99+197,20+295,80=
   1.478,99 exato, sem tocar valorOrig de ninguém. */
function soltarIntrusa(raizId){
  const d=diagLote(raizId); if(!d||!d.intrusa) return;
  const x=d.intrusa;
  const rot=(x.colecao?x.colecao+' · ':'')+(x.cat||'item');

    (sitDe(x)==='Trocado'?' (hoje está marcada como TROCADA sem troca registrada)':'')+'.\n\n'+
    'Depois disso a conta do lote fecha: '+fmt(d.soma-(+x.valor||0))+' = '+fmt(d.ref)+'.\n\n'+
    'Nada é apagado. Dá pra desfazer refazendo o vínculo.'))return;
  delete x.loteOrigem;
  if(sitDe(x)==='Trocado'){x.situacao='Em estoque';x.destino='Vender';delete x.dataTroca;delete x.trocaId;}
  if(x.valorOrig==null)x.valorOrig=+x.valor||0;
  x.obs=((x.obs||'')+' [solta do lote em '+new Date().toISOString().slice(0,10)+' — estava somando na conta de outra nota]').trim();
  save();fecharModal();
  toast('🧩 Solta — a conta do lote fechou ✓');

/* MESMA COMPRA — a segunda saída do diagnóstico (Felype 2026-08-13, caso real ABBYs eyes:
   a peça "intrusa" NÃO era de outra compra — a compra verdadeira era de 3 caixas e foi
   lançada errada como 2+1; a 3ª ainda apareceu como "saiu em troca" sem troca existir).
   O app só oferecia "soltar" (separar); faltava o caminho oposto. Regra dele, literal:
   "se dá opção pra um lado, tem que dar pro outro — o programa nunca pode induzir".
   IMPORTANTE (checagem dele, mesma data): marcar a caixa como "Aberta" NÃO manda nada pra
   coleção — "Aberta" é só o rótulo da caixa que virou pedaços; o destino de cada pedaço
   fica exatamente como está (estoque continua estoque pra vender, vendido continua vendido).
   A conta: o valor dos pedaços volta pra raiz (tinha sido cavado do lugar errado), a caixa
   redistribui o próprio valor nos pedaços por unidade (resíduo no último, nunca perde
   centavo), a referência da compra vira a soma verdadeira, e o custo gravado DENTRO da
   venda de pedaço vendido é atualizado junto — senão o lucro continuaria contado errado. */
function _calcMesmaCompra(raizId){
  const d=diagLote(raizId); if(!d||!d.intrusa) return null;
  const raiz=d.raiz,x=d.intrusa;
  /* [CORRIGIDO 2026-08-13, revisão adversarial com prova executada] pedaço que tem FILHOS
     próprios (ex.: porção 'Aberto' de uma caixa da própria raiz, fluxo normal do app) entrava
     na redistribuição — o valor dele era reescrito enquanto os filhos mantinham o antigo,
     quebrando a conservação (soma 2.236,14 vs ref 2.218,49 no cenário de teste) SEM culpado
     achável depois. Mesma guarda que o diagnóstico já usa pras suspeitas. */
  const pecas=d.fam.filter(p=>p.id!==raiz.id&&p.id!==x.id&&p.loteOrigem===raiz.id&&(p.cat||'')!==(raiz.cat||'')&&!movs.some(y=>y.loteOrigem===p.id));
  if(!pecas.length) return null;
  const unTot=pecas.reduce((s,p)=>s+(+p.qtd||1),0);
  if(unTot<1) return null;
  const vUn=Math.round((+x.valor||0)/unTot*100)/100;
  let acum=0;
  const linhas=pecas.map((p,i)=>{
    const nv=i===pecas.length-1?Math.round(((+x.valor||0)-acum)*100)/100:Math.round(vUn*(+p.qtd||1)*100)/100;
    if(i<pecas.length-1)acum=Math.round((acum+nv)*100)/100;
    return {p,novo:nv};
  });
  const devolvido=Math.round(pecas.reduce((s,p)=>s+(+p.valor||0),0)*100)/100;
  return {raiz,x,linhas,vUn,unTot,
    raizNovo:Math.round(((+raiz.valor||0)+devolvido)*100)/100,
    refNova:Math.round((d.ref+(+x.valor||0))*100)/100,
    refAtual:d.ref};
}

function aplicarMesmaCompra(raizId){

  if(!confirm('Aplicar? A compra vira UMA só de '+fmt(c.refNova)+' e a caixa de '+fmt(+c.x.valor||0)+' passa a ABERTA (nada vai pra coleção). Nada é apagado.'))return;
  const hoje=new Date().toISOString().slice(0,10);
  c.linhas.forEach(({p,novo})=>{
    /* achar a venda ANTES de mexer no loteOrigem — o formato antigo de vínculo aponta pro pai */
    const vd=movs.find(v=>v.tipo==='VENDA'&&v.origemId===p.id)||movs.find(v=>v.tipo==='VENDA'&&p.loteOrigem&&v.origemId===p.loteOrigem&&v.data===p.dataVenda&&(+v.qtd||1)===(+p.qtd||1)&&Math.abs((+v.custoOrigem||0)-(+p.valor||0))<0.02);

  save();fecharModal();
  toast('🔗 Corrigido — a compra agora é uma só: '+fmt(c.refNova)+' ✓');
  verLote(c.raiz.id);}
function verLote(id){const m=movs.find(x=>x.id===id);if(!m)return;
  const raiz=raizDe(m)||m;
  const familia=movs.filter(x=>x.tipo==='COMPRA'&&(raizDe(x)||x).id===raiz.id);
  familia.sort((a,b)=>(a.id===raiz.id?-1:b.id===raiz.id?1:((a.dataSaida||a.data||'')<(b.dataSaida||b.data||'')?-1:1)));
  const totLote=familia.reduce((s,x)=>s+(+x.valor||0),0);
  const EMO={'Em estoque':'📦','Vendido':'💰','Coleção':'⭐','Pedido':'🚚','Aberto':'🔓','Trocado':'🔄'};
  const lin=familia.map(x=>{const s=sitDe(x);

function baixarLote(loteId,qtdBaixa,novaSit,extras){const lote=movs.find(m=>m.id===loteId);if(!lote)return null;const qtd=+lote.qtd||1,vUnit=(+lote.valor||0)/qtd;qtdBaixa=Math.max(1,Math.min(qtdBaixa,qtd));const destDe=s=>s==='Coleção'?'Coleção':(s==='Vendido'||s==='Trocado'?'Vender':lote.destino);
  if(!lote.destIni)lote.destIni=(sitDe(lote)==='Coleção'?'Coleção':'Em estoque');
  if(!lote.loteOrigem&&lote.valorOrig==null)lote.valorOrig=+lote.valor||0; /* referência da conservação: valor ANTES da 1ª divisão (prova real confere a família contra ele) */
  if(qtdBaixa>=qtd){lote.situacao=novaSit;lote.destino=destDe(novaSit);if(extras)Object.assign(lote,extras);return lote;}
  /* conservação EXATA: pedaço arredondado, pai = original − pedaço (pai absorve o resíduo).
     Arredondar os dois lados separado perdia 1 centavo em casos tipo 1.126,85 ÷ 2 (float). */
  const vOrig=+lote.valor||0,vPedL=Math.round(qtdBaixa*vUnit*100)/100;
  lote.qtd=qtd-qtdBaixa;lote.valor=Math.round((vOrig-vPedL)*100)/100;
  const ped=Object.assign({},lote,{id:novoId(),qtd:qtdBaixa,valor:vPedL,situacao:novaSit,destino:destDe(novaSit),loteOrigem:loteId});if(extras)Object.assign(ped,extras);movs.push(ped);return ped;}
function baixarBoosters(loteId,nBoo,novaSit,extras){const lote=movs.find(m=>m.id===loteId);if(!lote)return null;
  const qtd=+lote.qtd||1,bpu=Math.max(1,+lote.boosters||1),tot=qtd*bpu,vLote=+lote.valor||0,vb=vLote/tot;
  nBoo=Math.max(1,Math.min(nBoo,tot));
  if(!lote.destIni)lote.destIni=(sitDe(lote)==='Coleção'?'Coleção':'Em estoque');
  if(!lote.loteOrigem&&lote.valorOrig==null)lote.valorOrig=vLote;
  const destDe=s=>s==='Coleção'?'Coleção':(s==='Vendido'||s==='Trocado'?'Vender':lote.destino);
  if(nBoo>=tot){lote.situacao=novaSit;lote.destino=destDe(novaSit);if(extras)Object.assign(lote,extras);return lote;}
  const rem=tot-nBoo,remCx=Math.floor(rem/bpu),remBoo=rem%bpu,vPed=Math.round(nBoo*vb*100)/100;
  const ped=Object.assign({},lote,{id:novoId(),qtd:nBoo,valor:vPed,cat:'Booster',boosters:1,vUnit:Math.round(vb*100)/100,situacao:novaSit,destino:destDe(novaSit),loteOrigem:loteId});
  if(extras)Object.assign(ped,extras);
  if(remCx===0){lote.qtd=remBoo;lote.valor=Math.round((vLote-vPed)*100)/100;lote.cat='Booster';lote.boosters=1;lote.vUnit=Math.round(vb*100)/100;lote.obs=(lote.obs?lote.obs+' · ':'')+'aberto em boosters';}
  else{lote.qtd=remCx;
    if(remBoo>0){const vSol=Math.round(remBoo*vb*100)/100;
      const solto=Object.assign({},lote,{id:novoId(),qtd:remBoo,valor:vSol,cat:'Booster',boosters:1,vUnit:Math.round(vb*100)/100,loteOrigem:loteId,obs:(lote.obs?lote.obs+' · ':'')+'aberto de '+(lote.cat||'caixa')});
      movs.push(solto);lote.valor=Math.round((vLote-vPed-vSol)*100)/100;}
    else lote.valor=Math.round((vLote-vPed)*100)/100;}
  movs.push(ped);return ped;}

/* ===== SELECT COM BUSCA (typeahead) — escolher ITEM em lista grande: digita e filtra por
   TODAS as palavras, sem acento/caixa ("pitch tr" acha "Pitch black · Triple"). O ID escolhido
   vive num hidden com o MESMO id que o select antigo usava — quem lê g('f_origem') não muda. */
let _sbDados={};
function sbNorm(s){return (''+(s||'')).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function selBusca(idBase,itens,preSelId,placeholder,onPick){
  _sbDados[idBase]={itens,onPick:onPick||null};
  const pre=itens.find(x=>x.id===preSelId);
  return `<div style="position:relative">
    <input id="${idBase}_q" placeholder="${placeholder||'digite pra filtrar… (ex.: pitch triple)'}" autocomplete="off" value="${pre?pre.rot.replace(/&/g,'&amp;').replace(/"/g,'&quot;'):''}" oninput="sbFiltra('${idBase}')" onfocus="sbFiltra('${idBase}')">
    <input type="hidden" id="${idBase}" value="${pre?pre.id:''}">
    <div id="${idBase}_dd" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--inpb);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 22px rgba(0,0,0,.35)"></div></div>`;}
function sbFiltra(idBase){const d=_sbDados[idBase];if(!d)return;
  const qEl=document.getElementById(idBase+'_q'),dd=document.getElementById(idBase+'_dd'),hid=document.getElementById(idBase);
  if(!qEl||!dd)return;
  const q=sbNorm(qEl.value);
  /* digitou por cima = desfez a escolha — o hidden zera até um novo toque na lista */
  if(hid){const atual=d.itens.find(x=>x.id===hid.value);if(!atual||sbNorm(atual.rot)!==q)hid.value='';}
  const termos=q.split(/\s+/).filter(Boolean);
  const hits=termos.length?d.itens.filter(x=>{const r=sbNorm(x.rot);return termos.every(t=>r.includes(t));}):d.itens;
  const MAX=40;
  dd.innerHTML=hits.slice(0,MAX).map(x=>`<div style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px" onmousedown="sbPick('${idBase}','${x.id}')">${x.rot.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('')
    +(hits.length>MAX?`<div style="padding:8px 12px;color:var(--mut);font-size:11px">+${hits.length-MAX} escondidos — continue digitando pra afinar</div>`:'')
    +(hits.length?'':'<div style="padding:10px 12px;color:var(--mut);font-size:12px">nada com esse texto — confira a grafia ou apague pra ver tudo</div>');
  dd.style.display='block';}

  if(hid)hid.value=id;if(qEl)qEl.value=x.rot;if(dd)dd.style.display='none';

  let investido=0,cmv=0;
  for(const m of compras){const v=+m.valor||0;const s=sitDe(m);if(s==='Trocado'||s==='Aberto')continue;investido+=v;if(s==='Vendido')cmv+=v;}

  for(const m of todasC){const v=+m.valor||0;const s=sitDe(m);if(s==='Em estoque')estoque+=v;else if(s==='Coleção')colCusto+=v;else if(s==='Pedido')pedido+=v;}

  let despOrd=0,despMat=0;const hojeISO2=new Date().toISOString().slice(0,10);for(const m of movs){if(m.tipo!=='DESPESA'||!noPer(m.data))continue;if(filtrar&&!mRelX(m))continue;if(m.status==='apagar'&&!perAte&&m.data>hojeISO2)continue;const v=+m.valor||0;if(m.natureza==='material')despMat+=v;else despOrd+=v;}

}
/* Quanto vale (Liga) o que está parado — Felype notou que só mostrávamos custo, nunca o
   valor de mercado. Só conta item com preço já coletado; nunca inventa preço pro resto —
   por isso devolve quantos entraram (comN) e quantos ficaram de fora (semN), honesto sobre
   cobertura parcial. */
/* VALOR DE MERCADO — REGRA DO FELYPE 2026-08-12: NUNCA considerar zero.
   Cascata, nesta ordem:
     1) preço ATUAL da Liga (mesmo que esteja ABAIXO do custo — ele foi explícito: "se o valor
        atual for menor do que o custo, tudo bem, entra o valor atual");
     2) ÚLTIMO preço já visto na Liga (caso da carta que saiu do site: "ele não pode marcar como
        zero; o valor que vai ficar é o último valor achado na Liga");
     3) o CUSTO de aquisição ("se não tem informação do valor atual, considera no mínimo o custo").
   Antes desta correção a função simplesmente IGNORAVA o item sem preço, o que fazia o card
   mostrar um total que parecia o valor da coleção mas era o de um punhado de cartas. */
function ultimoPrecoLigaDe(cod){
  const h=(_precosLiga&&_precosLiga.historico)?(_precosLiga.historico[(''+cod).trim()]||_precosLiga.historico[codLimpo(cod)]):null;
  if(!h)return null;
  let melhorD='',preco=null;
  Object.values(h).forEach(serie=>{if(!Array.isArray(serie))return;
    serie.forEach(p=>{if(p&&p.d&&p.d>=melhorD&&(p.md!=null||p.mn!=null)){melhorD=p.d;preco=(p.md!=null?p.md:p.mn);}});});
  return preco;
}
function valorMercadoDe(lista){
  let val=0,comN=0,semN=0,porUltimo=0,porCusto=0;
  lista.forEach(m=>{
    const qtd=(+m.qtd||1);
    const pl=precoLigaDe(m.codigo);
    const vs=(pl&&pl.status!=='AMBIGUO')?ligaVersoes(pl):[];
    const atual=vs.length?(vs[0].md!=null?vs[0].md:vs[0].mn):null;
    if(atual!=null){val+=atual*qtd;comN++;return;}
    const ult=m.codigo?ultimoPrecoLigaDe(m.codigo):null;
    if(ult!=null){val+=ult*qtd;porUltimo++;semN++;return;}
    val+=(+m.valor||0);porCusto++;semN++;
  });
  return {val:Math.round(val*100)/100,comN,semN,porUltimo,porCusto};}

/* Rateio de um valor extra (frete OU taxa) proporcional ao produto de cada item, com o
   RESÍDUO de arredondamento absorvido no último — Σ rateios = extra EXATO (classe do
   antipadrão 31: arredondar cada item separado deixava a soma divergir uns centavos). */
function ratearExato(extra,valores){const tot=valores.reduce((s,v)=>s+v,0);if(!(extra>0)||!(tot>0))return valores.map(()=>0);
  /* floor nos não-últimos: a soma deles nunca passa do extra → o resíduo do último é sempre ≥ 0
     (com round, frete pequeno em muitos itens dava último NEGATIVO — ex.: 0,13 em 18 itens) */
  let acum=0;return valores.map((v,i)=>{if(i===valores.length-1)return Math.round((extra-acum)*100)/100;
    const r=Math.floor(extra*v/tot*100)/100;acum=Math.round((acum+r)*100)/100;return r;});}

    ${(function(){const n=nSemConta();return n?`<div class="soon noprint" style="background:var(--infobg);color:var(--blue);cursor:pointer" onclick="migrarSemConta()">💼 ${n} lançamento${n>1?'s':''} de dinheiro SEM conta (não aparecem em saldo nenhum) — toque pra colocar todos na conta "dinheiro" e corrigir depois caso a caso.</div>`:'';})()}

function abrirNota(nid){const todos=movs.filter(m=>m.notaId===nid);if(!todos.length){toast('Nota não encontrada');return;}
  /* originais = itens lançados na nota; pedaços (loteOrigem) herdam notaId nas baixas mas não

  const itens=todos.filter(m=>!m.loteOrigem),pedacos=todos.filter(m=>m.loteOrigem);
  const h=itens[0]||todos[0];
  const tot=todos.reduce((s,x)=>s+(+x.valor||0),0);const nP=+h.nParc||0;
  const prodT=itens.reduce((s,x)=>s+(+x.valorProduto||0),0),freteT=itens.reduce((s,x)=>s+(+x.freteRateio||0),0),taxaT=itens.reduce((s,x)=>s+(+x.taxaRateio||0),0);
  const rotFT=(fr,tx)=>tx>0?`frete ${fmt(fr)} + taxa ${fmt(tx)}`:(fr>0?`frete/taxa ${fmt(fr)}`:'');
  const lin=itens.map(m=>{const vp=+m.valorProduto||0,fr=+m.freteRateio||0,tx=+m.taxaRateio||0,vAtual=+m.valor||0;
    const ft=rotFT(fr,tx);
    const raiz=vp>0?`produto ${fmt(vp)}${ft?' + '+ft:''} = <b>${fmt(vp+fr+tx)}</b>`:`${(+m.qtd||1)}× ${fmt(vAtual/(+m.qtd||1))}`;
    const mudou=vp>0&&Math.abs(vp+fr+tx-vAtual)>0.02?`<br><span style="color:var(--amber)">hoje neste lançamento: ${fmt(vAtual)} — parte já saiu do lote (ver 🧩 no item)</span>`:'';

  const hh=`<div id="modal" onclick="if(event.target.id==='modal')fecharModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end"><div style="background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto">
    <div class="sec" style="margin-top:0">🧾 Nota${h.notaNum?' '+h.notaNum:''} — original</div>
    <div class="ctx">Emitida em <b>${dBR(new Date(h.data+'T00:00:00'))}</b> · ${h.contraparte||'—'} · custou <b>${fmt(tot)}</b>${prodT>0?` <span style="color:var(--mut)">(produto ${fmt(prodT)}${rotFT(freteT,taxaT)?' + '+rotFT(freteT,taxaT):''})</span>`:''}${nP>1?` · paga em <b>${nP}×</b> de <b>${fmt(tot/nP)}</b> (1ª em ${dBR(new Date((h.venc1||h.data)+'T00:00:00'))})`:' · à vista'} — confira com a nota do fornecedor: produto e frete/taxa separados são a prova real.</div>
    <button class="btn g" style="margin-bottom:8px" onclick="editarNota('${nid}')">✏️ editar a nota — quantidades, valores, frete e taxa</button>
    ${lin}
    ${/* Felype 2026-08-12: quando a nota nao tem NENHUM produto visivel (todos viraram pedaco de
          saida), a frase "toque num produto" mandava tocar em coisa que nao existe na tela — ele
          clicou e nao foi a lugar nenhum. Caso real: nota de 21/06 HOLDING/VIANA, "0 produto",
          R$739,50. Agora os proprios pedacos viram linhas clicaveis que levam ao lote. */
      !pedacos.length?'':(itens.length?
      `<div class="meta" style="padding:4px 12px">🧩 +${pedacos.length} pedaço(s) de saída (venda/abertura/troca) contando no total — toque num produto e use "ver o lote completo" pra rastrear.</div>`
      :`<div class="meta" style="padding:4px 12px">🧩 Nenhum produto desta nota está inteiro hoje — os ${pedacos.length} pedaço(s) abaixo saíram por venda, abertura ou troca e são o que forma o total. Toque pra rastrear:</div>`
       +pedacos.map(pz=>{const s=sitDe(pz);const EMOP={'Em estoque':'📦','Vendido':'💰','Coleção':'⭐','Pedido':'🚚','Aberto':'🔓','Trocado':'🔄'};
         return `<div class="item" style="justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer" onclick="fecharModal();verLote('${pz.id}')"><div><b>${EMOP[s]||''} ${(+pz.qtd||1)} un · ${pz.cat||'item'}</b>${pz.colecao?`<div class="meta">${pz.colecao} · ${s.toLowerCase()}</div>`:`<div class="meta">${s.toLowerCase()}</div>`}</div><div style="text-align:right;font-weight:700;white-space:nowrap">${fmt(+pz.valor||0)}<div class="meta" style="color:var(--blue)">ver o lote →</div></div></div>`;}).join(''))}
    <div style="display:flex;justify-content:space-between;border-top:2px solid var(--line);margin-top:8px;padding-top:8px;font-weight:700"><span>Total (${itens.length} ${itens.length===1?'produto':'produtos'})</span><span>${fmt(tot)}</span></div>
    <div class="ctx" style="margin-top:8px">Entrou junto mas era separado? Toque num produto pra editar, use "✂ tirar da nota" na Consultar (um a um) ou desfaça a nota inteira:</div>
    <button class="btn g" style="margin-top:4px" onclick="desfazerNota('${nid}')">✂ desfazer nota — cada produto vira compra solta</button>
    <button class="btn g" style="margin-top:8px;color:var(--red)" onclick="excluirNotaInteira('${nid}')">🗑 excluir a nota INTEIRA — apaga os lançamentos</button>
    <button class="btn g" style="margin-top:8px" onclick="fecharModal()">fechar</button></div></div>`;
  document.getElementById('modal')?.remove();document.body.insertAdjacentHTML('beforeend',hh);}
/* Edição PELA NOTA: quantidades, produto por item, frete e taxa da nota — re-rateio exato
   ao salvar, mutação direta nos lançamentos (preserva parcelas pagas, fotos, vínculos).
   Guarda: nota com pedaços já fracionados trava valores (mexer na base quebraria a
   conservação da família) — só data/nº ficam livres nesse caso. */
function notaTemSaidas(todos,itens){return todos.some(m=>m.loteOrigem)
  ||itens.some(m=>movs.some(x=>x.loteOrigem===m.id))
  ||itens.some(m=>['Vendido','Trocado','Aberto'].includes(sitDe(m))||movs.some(v=>v.tipo==='VENDA'&&v.origemId===m.id));}
function editarNota(nid){const todos=movs.filter(m=>m.notaId===nid);if(!todos.length)return;
  const itens=todos.filter(m=>!m.loteOrigem);const h=itens[0]||todos[0];
  const temPedacos=notaTemSaidas(todos,itens);
  const freteAt=Math.round(itens.reduce((s,x)=>s+(+x.freteRateio||0),0)*100)/100;
  const taxaAt=Math.round(itens.reduce((s,x)=>s+(+x.taxaRateio||0),0)*100)/100;
  const linI=itens.map(m=>{const vp=+m.valorProduto||Math.round(((+m.valor||0)-(+m.freteRateio||0)-(+m.taxaRateio||0))*100)/100;
    return temPedacos
      ?`<div class="item" style="display:block;padding:9px 12px"><b>${m.cat||'item'}</b>${m.colecao?' · '+m.colecao:''}<div class="meta">🧩 nota com saídas — quantidades e valores travados (${(+m.qtd||1)} un · produto ${fmt(vp)})</div></div>`
      :`<div class="item" style="display:block;padding:9px 12px"><b>${m.cat||'item'}</b>${m.colecao?' · '+m.colecao:''}${m.codigo?' <span style="color:var(--mut);font-size:10px">#'+m.codigo+'</span>':''}
        <div class="row2" style="margin-top:6px"><div><label style="margin-top:0">Qtd</label><input id="ne_q_${m.id}" type="number" inputmode="numeric" value="${+m.qtd||1}" min="1"></div>
        <div><label style="margin-top:0">Produto — total do item (R$)</label><input id="ne_p_${m.id}" type="number" inputmode="decimal" value="${vp}" step="0.01"></div></div></div>`;}).join('');
  const hh=`<div id="modal" onclick="if(event.target.id==='modal')fecharModal()" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end"><div style="background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto">
    <div class="sec" style="margin-top:0">✏️ Editar nota${h.notaNum?' '+h.notaNum:''}</div>
    <div class="ctx">Corrija aqui e o app refaz o rateio de frete e taxa proporcional ao produto de cada item — parcelas pagas, fotos e vínculos ficam como estão.${temPedacos?' <b>Esta nota já tem saídas (venda/abertura): quantidades, valores, frete e taxa estão travados — só data e nº liberados.</b>':''}</div>
    <div class="row2"><div><label style="margin-top:0">Data de emissão</label><input id="ne_data" type="date" value="${h.data||''}"></div>
      <div><label style="margin-top:0">Nº da nota</label><input id="ne_num" value="${(h.notaNum||'').replace(/"/g,'&quot;')}" placeholder="opcional"></div></div>
    ${(+h.nParc||0)>1?`<div class="row2"><div><label>1ª parcela vence em</label><input id="ne_venc1" type="date" value="${h.venc1||h.data||''}"></div><div></div></div>`:''}
    ${temPedacos?'':`<div class="row2"><div><label>Frete da nota (R$)</label><input id="ne_frete" type="number" inputmode="decimal" value="${freteAt}" step="0.01" min="0"></div>
      <div><label>Taxa da nota (R$) <span style="color:var(--mut);font-size:10px">(Wise, câmbio, IOF…)</span></label><input id="ne_taxa" type="number" inputmode="decimal" value="${taxaAt}" step="0.01" min="0"></div></div>`}
    <div class="sec">Produtos</div>
    ${linI}
    <button class="btn" style="margin-top:12px" onclick="salvarEdicaoNota('${nid}')">Salvar alterações</button>
    <button class="btn g" style="margin-top:8px" onclick="abrirNota('${nid}')">cancelar — voltar pra nota</button></div></div>`;
  document.getElementById('modal')?.remove();document.body.insertAdjacentHTML('beforeend',hh);}
function salvarEdicaoNota(nid){const todos=movs.filter(m=>m.notaId===nid);if(!todos.length)return;
  const itens=todos.filter(m=>!m.loteOrigem);
  const temPedacos=notaTemSaidas(todos,itens);
  const g=id=>document.getElementById(id);
  const dataN=g('ne_data')?.value||itens[0].data,numN=(g('ne_num')?.value||'').trim();
  const venc1N=g('ne_venc1')?.value||'';
  if(!temPedacos){
    const frete=Math.max(0,+g('ne_frete')?.value||0),taxa=Math.max(0,+g('ne_taxa')?.value||0);
    const novos=itens.map(m=>({m,q:Math.max(1,+g('ne_q_'+m.id)?.value||1),p:Math.round((+g('ne_p_'+m.id)?.value||0)*100)/100}));
    if(novos.some(x=>x.p<=0)){alert('Todo item precisa de um valor de produto maior que zero.');return;}
    const rF=ratearExato(frete,novos.map(x=>x.p)),rT=ratearExato(taxa,novos.map(x=>x.p));
    const totN=Math.round((novos.reduce((s,x)=>s+x.p,0)+frete+taxa)*100)/100;
    if(!confirm('Salvar a nota corrigida?\n\nProduto '+fmt(novos.reduce((s,x)=>s+x.p,0))+' + frete '+fmt(frete)+' + taxa '+fmt(taxa)+' = TOTAL '+fmt(totN)+'\n\nO rateio refaz proporcional; parcelas pagas, fotos e vínculos não mudam.'))return;
    novos.forEach((x,i)=>{const m=x.m;
      m.qtd=x.q;m.valorProduto=x.p;m.freteRateio=rF[i];m.taxaRateio=rT[i];
      m.valor=Math.round((x.p+rF[i]+rT[i])*100)/100;m.vUnit=Math.round(m.valor/x.q*100)/100;
      /* obs: substitui SÓ o prefixo padrão "nota · +R$X frete/taxa"; obs de item juntado
         (que não segue o padrão) é preservada inteira com separador — nunca colada/comida */
      const pref=((rF[i]+rT[i])>0?`nota · +${fmt(rF[i]+rT[i])} frete/taxa`:'nota');
      const mObs=(m.obs||'').match(/^nota( · \+R\$ [\d.,]+ frete\/taxa)?(?=( · )|$)/);
      const resto=mObs?(m.obs||'').slice(mObs[0].length):((m.obs||'')?' · '+(m.obs||''):'');
      m.obs=pref+resto;});
  }
  todos.forEach(m=>{m.data=dataN;m.notaNum=numN;if(venc1N&&(+m.nParc||0)>1)m.venc1=venc1N;});
  save();toast('Nota corrigida ✓');fecharModal();abrirNota(nid);render();}
function excluirNotaInteira(nid){const its=movs.filter(m=>m.notaId===nid);if(!its.length)return;
  const tot=its.reduce((s,x)=>s+(+x.valor||0),0);
  if(!confirm('⚠️ Excluir a nota'+(its[0].notaNum?' '+its[0].notaNum:'')+' INTEIRA?\n\nApaga os '+its.length+' lançamentos (total '+fmt(tot)+') — o custo e o estoque deles somem dos números, como se nunca tivessem existido.\n\nUse pra relançar do zero. Excluir?'))return;
  movs=movs.filter(m=>m.notaId!==nid);save();fecharModal();toast('Nota excluída — '+its.length+' lançamentos apagados');render();}
function desfazerNota(nid){const its=movs.filter(m=>m.notaId===nid);if(!its.length)return;
  if(!confirm('Desfazer a nota'+(its[0].notaNum?' '+its[0].notaNum:'')+'? Os '+its.length+' produtos viram compras SOLTAS (cada um mantém seu valor e pagamento) — os lançamentos não são apagados.'))return;
  its.forEach(m=>{delete m.notaId;delete m.notaNum;});
  save();fecharModal();toast('Nota desfeita — '+its.length+' produtos soltos ✓');render();}

function simVals(){const g=id=>+document.getElementById(id)?.value||0;const V=g('s_val'),din=g('s_din');let faceMat,custoMat;
  if(simMatModo==='real'){custoMat=g('s_custo');faceMat=g('s_passei');}else{const marg=g('s_marg')/100;faceMat=simMat==='%'?V*g('s_mat')/100:g('s_mat');custoMat=faceMat/(1+marg);}
  return {V,din,faceMat,custoMat,rev:simRev==='%'?V*g('s_rev')/100:g('s_rev'),taxa:g('s_taxa')/100};}
function simCalc(){const out=document.getElementById('simout');if(!out)return;const{V,din,faceMat,custoMat,rev,taxa}=simVals();

}

function chavePer(data,g){const d=new Date(data+'T00:00:00');if(g==='ano')return ''+d.getFullYear();if(g==='mes')return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');if(g==='semana'){const x=new Date(d);x.setDate(d.getDate()-((d.getDay()+6)%7));return x.toISOString().slice(0,10);}return data;}
function rotuloPer(k,g){if(g==='ano')return k;const p=k.split('-');if(g==='mes')return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+p[1]-1]+'/'+p[0].slice(2);if(g==='semana')return 'sem de '+p[2]+'/'+p[1];return p[2]+'/'+p[1];}
function fluxoBuckets(){const B={},hoje=new Date().toISOString().slice(0,10);
  const add=(dt,s,v)=>{if(!dt||!noPer(dt)||!(v>0))return;const k=chavePer(dt,relGran);(B[k]=B[k]||{})[s]=(B[k][s]||0)+v;};
  const dIni=m=>m.destIni||((sitDe(m)==='Coleção'&&!m.loteOrigem)?'Coleção':'Em estoque');
  movs.forEach(m=>{const v=+m.valor||0;
    if(m.tipo==='DESPESA'){if(relJogo||relCol)return;if(relPess&&(m.contraparte||'')!==relPess)return;if(m.status==='apagar'&&!perAte&&m.data>hoje)return;add(m.data,'din_out',v);return;}
    if(m.tipo==='VENDA'){if(!mRel(m))return;add(m.data,'din_in',v*(1-(+m.taxa||0)/100));const co=+m.custoOrigem||0;if(co)add(m.data,m.vendaTipo==='colecao'?'col_out':'est_out',co);return;}
    if(m.tipo!=='COMPRA'||!mRel(m))return;
    if(!m.origem)add(m.data,'din_out',v);
    const di=dIni(m),s=sitDe(m);
    add(m.data,di==='Coleção'?'col_in':'est_in',v);
    if(s==='Trocado'||s==='Aberto')add(m.dataSaida||m.data,di==='Coleção'?'col_out':'est_out',v);
    else if(s==='Coleção'&&di!=='Coleção'){add(m.dataSaida||m.data,'col_in',v);add(m.dataSaida||m.data,'est_out',v);}
  });return B;}
const FLUXOS=[['din_in','💰 dinheiro entrou','var(--green)'],['din_out','💰 dinheiro saiu','var(--red)'],['est_in','📦 estoque entrou','var(--blue)'],['est_out','📦 estoque saiu','#7ea8dd'],['col_in','⭐ coleção entrou','var(--amber)'],['col_out','⭐ coleção saiu','#c9964f']];
function timelineHtml(){const B=fluxoBuckets();

    ${on.map(([s,l,c])=>{const v=b[s]||0;return `<div style="display:flex;align-items:center;gap:7px;margin-top:3px;cursor:pointer" onclick="irPer('${k}','${FC[s]||'tudo'}')"><span style="width:112px;flex:none;font-size:11px;color:var(--mut)">${l}</span><div style="flex:1;height:5px;background:var(--card2);border-radius:3px"><div style="height:5px;border-radius:3px;background:${c};width:${v>0?Math.max(2,Math.round(v/mx*100)):0}%"></div></div><span style="width:86px;flex:none;text-align:right;font-size:11px">${v?fmt(v):'—'}</span></div>`;}).join('')}</div>`;}).join('');}
function raizDe(m){let x=m,g=0;while(x&&x.loteOrigem&&g++<20){const p=movs.find(y=>y.id===x.loteOrigem);if(!p)break;x=p;}return x;}
function extDimFiltrado(){return !!(relJogo||relCol||relPess||relCat);} /* recorte por dimensão: saldo inicial não se aplica */
function antesDaBase(m){const cb=contasBanc.find(c=>c.nome===(m.conta||''));return !!(cb&&cb.saldoData&&(m.data||'')<cb.saldoData);} /* movimento anterior à data-base da conta: já está dentro do saldo inicial dela */
function saldoBaseExtrato(){/* saldo REAL antes do início do período: saldos iniciais + movimentos anteriores a perDe */
  const hoje=new Date().toISOString().slice(0,10);let base=0;
  contasBanc.filter(cb=>!extConta||cb.nome===extConta).forEach(cb=>{base+=(+cb.saldoIni||0);});
  if(perDe)movs.forEach(m=>{
    if(extConta&&(m.conta||'')!==extConta)return;
    if(antesDaBase(m))return;
    if((m.data||'')>=perDe)return;
    if(m.tipo==='VENDA')base+=(+m.valor||0)*(1-(+m.taxa||0)/100);
    else if(m.tipo==='COMPRA'&&!m.origem)base-=(+m.valor||0);
    else if(m.tipo==='DESPESA'){if(m.status==='apagar'&&m.data>hoje)return;base-=(+m.valor||0);}});

function extratoRows(){const rows=[],seen={},hoje=new Date().toISOString().slice(0,10);
  movs.forEach(m=>{
    /* transferência/aporte e dinheiro de troca têm conta em campos próprios */
    if(m.tipo==='TRANSF'){if(antesDaBase(m)||!noPer(m.data))return;const v=+m.valor||0;
      const rotDe=m.contaDe||'fora do app',rotPara=m.contaPara||'fora do app';
      if(extConta){if(m.contaDe===extConta)rows.push({data:m.data,v:-v,desc:'↔ Transferência → '+rotPara+(m.obs?' · '+m.obs:''),quem:'',conta:extConta,id:m.id});
        if(m.contaPara===extConta)rows.push({data:m.data,v:v,desc:'↔ Transferência ← '+rotDe+(m.obs?' · '+m.obs:''),quem:'',conta:extConta,id:m.id});}
      else{if(!m.contaDe&&m.contaPara)rows.push({data:m.data,v:v,desc:'↔ Aporte externo → '+rotPara+(m.obs?' · '+m.obs:''),quem:'',conta:m.contaPara,id:m.id});
        else if(m.contaDe&&!m.contaPara)rows.push({data:m.data,v:-v,desc:'↔ Retirada de '+rotDe+(m.obs?' · '+m.obs:''),quem:'',conta:m.contaDe,id:m.id});
        else rows.push({data:m.data,v:0,desc:'↔ '+rotDe+' → '+rotPara+' ('+fmt(v)+')'+(m.obs?' · '+m.obs:''),quem:'',conta:'',id:m.id});}
      return;}
    if(m.tipo==='COMPRA'&&m.origem==='TROCA'&&+m.din>0&&m.dinConta){if(antesDaBase(m)||!noPer(m.data))return;
      if(!extConta||m.dinConta===extConta)rows.push({data:m.data,v:-(+m.din),desc:'Troca — dinheiro dado',quem:m.contraparte||'',conta:m.dinConta,id:m.id});
      if(extConta&&m.dinConta!==extConta)return;}
    if(extConta&&(m.conta||'')!==extConta)return;
    if(antesDaBase(m))return;
    if(m.tipo==='VENDA'){if(!mRel(m)||!noPer(m.data))return;rows.push({data:m.data,v:(+m.valor||0)*(1-(+m.taxa||0)/100),desc:'Venda — '+([m.cat,m.colecao].filter(Boolean).join(' ')||'item'),quem:m.contraparte||'',conta:m.conta||'',id:m.id});return;}
    if(m.tipo==='DESPESA'){if(relJogo||relCol||relCat)return;if(relPess&&(m.contraparte||'')!==relPess)return;if(!noPer(m.data))return;if(m.status==='apagar'&&!perAte&&m.data>hoje)return;rows.push({data:m.data,v:-(+m.valor||0),desc:'Despesa — '+(m.cat||''),quem:m.contraparte||'',conta:m.conta||'',id:m.id});return;}
    if(m.tipo!=='COMPRA'||m.origem)return;if(!mRel(m)||!noPer(m.data))return;

    const r={data:m.data,v:-(+m.valor||0),quem:m.contraparte||'',conta:m.conta||'',id:rz.id,notaId:m.notaId||null,n:1,rz};seen[key]=r;rows.push(r);});
  rows.forEach(r=>{if(r.desc)return;r.desc=r.notaId?('Compra — nota'+(r.rz.notaNum?' '+r.rz.notaNum:'')+' ('+r.n+' produtos)'):('Compra — '+([r.rz.cat,r.rz.colecao].filter(Boolean).join(' ')||'item'));});
  rows.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);

  return extOrdem==='asc'?rows:rows.reverse();}
function extratoHtml(){const rows=extratoRows();

function tabelaFluxo(entDesc,on){if(!entDesc.length)return '<div class="meta">Sem lançamentos no período (com esses filtros).</div>';

function graficoSvg(entDesc,on){const ent=entDesc.slice(0,12).reverse();
  if(!ent.length)return '<div class="meta">Sem dados no período.</div>';
  if(!on.length)return '<div class="meta">Ligue ao menos um fluxo acima.</div>';

  const bw=Math.max(4,Math.min(16,(iw-12)/on.length));
  const abbr=v=>v>=1e6?(v/1e6).toFixed(1).replace('.',',')+'M':v>=1e3?(v/1e3).toFixed(v>=1e4?0:1).replace('.',',')+'k':''+Math.round(v);
  let g='';
  [0,.25,.5,.75,1].forEach(f=>{const yy=y(mx*f);g+=`<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--mut)">${abbr(mx*f)}</text>`;});
  ent.forEach(([k,b],i)=>{const cx=padL+i*iw+iw/2;

    g+=`<text x="${cx}" y="${H-padB+15}" text-anchor="middle" font-size="9" fill="var(--mut)">${rotuloPer(k,relGran)} →</text>`;
    g+=`<rect x="${(padL+i*iw).toFixed(1)}" y="0" width="${iw.toFixed(1)}" height="${H}" fill="transparent" style="cursor:pointer" onclick="irPer('${k}')"/>`;});
  const legenda=`<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;justify-content:center">${on.map(([s,l,c])=>`<span style="font-size:11px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin-right:5px;vertical-align:-1px"></span>${l}</span>`).join('')}</div>`;

function graficoCompSvg(series){
  const score={};series.forEach(S=>Object.entries(S.o).forEach(([k,v])=>{score[k]=(score[k]||0)+v;}));
  const chaves=Object.keys(score).sort((a,b)=>score[b]-score[a]).slice(0,8);
  if(!chaves.length)return '<div class="meta">sem dados no período</div>';
  const W=720,H=290,padL=48,padB=44,padT=12,padR=8,iw=(W-padL-padR)/chaves.length;
  const mx=Math.max(...chaves.map(k=>Math.max(...series.map(S=>S.o[k]||0))),1);
  const y=v=>padT+(H-padT-padB)*(1-v/mx);

  let val=+g('f_val')||0;
  if(val===0&&!confirm('O valor está R$ 0. Foi de graça / brinde? Toque OK pra salvar mesmo assim.'))return;
  /* PENDÊNCIA 4 (Felype): mudar a QUANTIDADE de uma compra sem mudar o valor total é ambíguo —
     o app não sabia se o total da nota é fixo (custo por unidade recalcula sozinho) ou se o
     custo por unidade é que devia ficar fixo (o total muda). Só pergunta quando a quantidade
     MUDOU e o valor ficou exatamente como estava — se o dono também editou o valor, a intenção

  if(tipoSel==='COMPRA'&&editId&&e&&e.tipo==='COMPRA'){

      const manterTotal=confirm('Quantidade mudou de '+qtdAntiga+' para '+qtdNova+' un, mas o valor total ficou igual ('+fmt(+e.valor||0)+').\n\nOK = manter o TOTAL em '+fmt(+e.valor||0)+' — custo por unidade passa a '+fmt((+e.valor||0)/qtdNova)+'\nCancelar = manter o custo por unidade em '+fmt(vuAntigo)+' — total passa a '+fmt(vuAntigo*qtdNova));
      if(!manterTotal)val=Math.round(vuAntigo*qtdNova*100)/100;
    }
  }

  if(tipoSel==='COMPRA'){const cat=g('f_cat');if(!cat||cat==='__add__'){alert('Escolha o tipo de produto.');return;}
    const sit=g('f_sit')||'Em estoque';

    if(_linkPend['f_cod']){obj.codigoUrl=_linkPend['f_cod'];delete _linkPend['f_cod'];}
  } else {const cp=g('f_cp');if(!cp||cp==='__add__'){alert('O cliente é obrigatório na venda.');return;}
    const comum={obs:g('f_desc')||'',canal,taxa:canal==='App'?(+g('f_tax')||0):0,recDias:canal==='App'?(+g('f_recdias')||0):0,conta:(g('f_conta')&&g('f_conta')!=='__add__')?g('f_conta'):'',contraparte:cp,destino:'Vender'};
    if(!editId&&vendaDe!=='avulsa'){const it=movs.find(m=>m.id===g('f_origem'));if(!it){alert('Escolha o item que você vendeu (ou use Avulsa).');return;}
      const eraPedido=sitDe(it)==='Pedido';

      const bpu=Math.max(1,+it.boosters||1),boo=(vendaUn==='boo'&&bpu>1);
      const dispI=boo?(+it.qtd||1)*bpu:(+it.qtd||1),vUnitI=(+it.valor||0)/dispI,qv=Math.min(+g('f_qtd')||1,dispI);
      const jg=it.jogo||'Pokémon',ct=boo?'Booster':(it.cat||''),cl=it.colecao||'',idi=it.idioma||'',cnd=it.condicao||'';

      const pedV=boo?baixarBoosters(it.id,qv,'Vendido',ex):baixarLote(it.id,qv,'Vendido',ex);
      Object.assign(obj,comum,{qtd:qv,jogo:jg,cat:ct,colecao:cl,idioma:idi,condicao:cnd,codigo:it.codigo||'',vendaDe:eraPedido?'pedido':vendaDe,origemId:it.id,custoOrigem:Math.round(vUnitI*qv*100)/100,vendaTipo:vendaDe==='colecao'?'colecao':'material'});
      if(pedV&&pedV.id!==it.id)pedV.vendaRef=obj.id; /* dono do pedaço gravado na hora (detector de órfãos fica determinístico) */
    } else {Object.assign(obj,comum,{jogo:g('f_jogo')||'Pokémon',cat:g('f_cat')||'',colecao:(g('f_col')&&g('f_col')!=='__add__')?g('f_col'):'',idioma:g('f_idi')||'',codigo:g('f_cod')||'',vendaTipo:e?.vendaTipo||'material'});}}
  if(tipoSel==='VENDA'&&!editId&&!obj.origemId&&!confirm('✍ Venda AVULSA — sem escolher o item do estoque/coleção/pedido.\n\nAssim o app NÃO dá baixa no material e não calcula lucro. Use só se o material não está cadastrado no app.\n\nOK = salvar avulsa mesmo · Cancelar = voltar e escolher em "De onde sai a carta?"'))return;
  if(!editId&&(tipoSel==='COMPRA'||tipoSel==='VENDA')&&!avisaSemConta(obj.conta,tipoSel==='VENDA'?'Venda':'Compra'))return;
  if(tipoSel==='VENDA'&&!editId){const og=obj.origemId?movs.find(z=>z.id===obj.origemId):null;
    const temF=_fotosPend.length>0||(og&&(((+og.nFotos)||0)>0||og.fotoThumb));
    if(!temF&&!confirm('📷 Essa venda vai ficar SEM foto (e o item de origem também não tem).\n\nOK = salvar sem foto · Cancelar = voltar pra anexar em "📷 fotos do lançamento".'))return;}
  if(editId){const i=movs.findIndex(m=>m.id===editId);
    /* Edição NUNCA recomeça o registro do zero: parte do antigo e sobrescreve só o que o
       formulário realmente edita — senão vínculo (origemId/custoOrigem), venda multi-item
       (vendaId), nota (notaId), parcelas pagas (pgParcelas), lote (loteOrigem) e fotos
       (nFotos/fotoThumb) somem em silêncio a cada edição (aconteceu de verdade).
       Exceções do merge: tipo TROCADO na edição = relançamento (objeto limpo, senão a compra
       herda canal/origemId da venda antiga — quimera); destIni só sobrevive se a SITUAÇÃO não
       mudou (mudar situação em edição é corrigir lançamento errado, o histórico recalcula). */
    movs[i]=(e&&e.tipo===obj.tipo)?Object.assign({},e,obj):obj;
    if(e&&e.destIni&&(e.situacao||'')===(obj.situacao||''))movs[i].destIni=e.destIni;
    /* corrigir preço de propósito NÃO pode virar alarme de conservação: o delta da edição
       acompanha a referência da família (raiz.valorOrig) */
    if(e&&e.tipo===obj.tipo&&obj.tipo==='COMPRA'&&Math.abs((+obj.valor||0)-(+e.valor||0))>0.001){
      const delta=Math.round(((+obj.valor||0)-(+e.valor||0))*100)/100;
      const rzE=movs[i].loteOrigem?(raizDe(movs[i])||movs[i]):movs[i];
      if(rzE&&rzE.valorOrig!=null)rzE.valorOrig=Math.round((rzE.valorOrig+delta)*100)/100;}
    /* venda VINCULADA: custoOrigem é o custo TOTAL congelado no momento do vínculo (unit ×
       qtd de então) — editar a quantidade sem reajustar isso deixa o lucro mentindo em
       silêncio (achado do Felype 2026-08-10). "Valor" (o que o cliente pagou) não precisa
       de ajuste aqui — o lucro já lê m.valor direto, então uma correção nele já se reflete
       sozinha. Mesma filosofia do bloco de COMPRA acima: corrigir registro é diferente de
       reabrir a operação física do lote — não mexe em baixarLote/loteOrigem. */
    if(e&&e.tipo===obj.tipo&&obj.tipo==='VENDA'&&e.origemId&&e.custoOrigem!=null){
      const qAntiga=+e.qtd||1,qNova=+obj.qtd||1;
      if(Math.abs(qNova-qAntiga)>0.0001){
        const custoUnit=(+e.custoOrigem||0)/qAntiga;
        movs[i].custoOrigem=Math.round(custoUnit*qNova*100)/100;}}
    save();editId=null;toast('Alteração salva');go('consultar');return;}
  movs.push(obj);aplicarFotosPend(obj.id);save();_lancarDirty=false;toast('Salvo ✓ — lance o próximo');render();
}

function salvarConta(id){const g=k=>document.getElementById('cb_'+k)?.value;const nome=(g('nome')||'').trim();if(!nome){alert('Informe o nome da conta.');return;}
  const antigo=id?(contasBanc.find(x=>x.id===id)?.nome||null):null;
  const o={id:id||novoId('b'),nome,banco:g('banco')||'',nbanco:g('nbanco')||'',agencia:g('agencia')||'',numero:g('numero')||'',titular:g('titular')||'',saldoIni:(g('saldoIni')===''||g('saldoIni')==null)?null:+g('saldoIni'),saldoData:g('saldoData')||'',obs:g('obs')||''};
  if(id){const i=contasBanc.findIndex(x=>x.id===id);if(i>=0)contasBanc[i]=o;}else contasBanc.push(o);
  if(antigo&&antigo!==nome){const pi=pgs.indexOf(antigo);if(pi>=0)pgs[pi]=nome;else if(!pgs.includes(nome))pgs.push(nome);
    /* renomear propaga em TODO lugar que guarda o nome — transferências, dinheiro de troca e

    movs.forEach(m=>{if(m.conta===antigo)m.conta=nome;

function saldoConta(cb){const hoje=new Date().toISOString().slice(0,10);let s=+cb.saldoIni||0;
  movs.forEach(m=>{
    if(cb.saldoData&&(m.data||'')<cb.saldoData)return;
    /* transferência/aporte e o dinheiro dado em troca usam campos próprios de conta */
    if(m.tipo==='TRANSF'){const v=+m.valor||0;if(m.contaDe===cb.nome)s-=v;if(m.contaPara===cb.nome)s+=v;return;}
    if(m.tipo==='COMPRA'&&m.origem==='TROCA'&&+m.din>0&&m.dinConta===cb.nome){s-=+m.din;return;}
    if((m.conta||'')!==cb.nome)return;
    if(m.tipo==='VENDA')s+=(+m.valor||0)*(1-(+m.taxa||0)/100);
    else if(m.tipo==='COMPRA'&&!m.origem)s-=(+m.valor||0);
    else if(m.tipo==='DESPESA'){if(m.status==='apagar'&&m.data>hoje)return;s-=(+m.valor||0);}});
  return Math.round(s*100)/100;}
/* Saldo FÍSICO por conta — o dinheiro que JÁ saiu/entrou de verdade: compra parcelada só
   debita as parcelas PAGAS (na conta do pagamento, quando registrada); venda no app só
   credita depois do prazo de recebimento. É o número do dia a dia — "por emissão" continua
   ao lado, rotulado (regra: convenções diferentes SEMPRE rotuladas, nunca misturadas). */
function saldoFisicoConta(cb){const hoje=new Date();hoje.setHours(0,0,0,0);const hojeISO=new Date().toISOString().slice(0,10);
  let s=+cb.saldoIni||0;
  const pagouDe=(m,pi)=>{const p=(m.pgParcelas||{})[pi];return (p&&typeof p==='object'&&p.conta)?p.conta:(m.conta||'');};
  /* a data-base do saldo inicial corta pela data em que o dinheiro MEXEU (regime caixa):
     parcela = dia do pagamento; venda no app = dia do recebimento — não pela emissão */
  const antesBase=d=>cb.saldoData&&(d||'')<cb.saldoData;
  const notasVistas={};
  movs.forEach(m=>{
    if(m.tipo==='TRANSF'){if(antesBase(m.data))return;const v=+m.valor||0;if(m.contaDe===cb.nome)s-=v;if(m.contaPara===cb.nome)s+=v;return;}
    if(m.tipo==='COMPRA'&&m.origem==='TROCA'&&+m.din>0&&m.dinConta===cb.nome){if(antesBase(m.data))return;s-=+m.din;return;}
    if(m.tipo==='VENDA'){if((m.conta||'')!==cb.nome)return;
      let dRec=m.data||'';
      if(m.canal==='App'&&+m.recDias>0){const d=new Date((m.data||'')+'T00:00:00');d.setDate(d.getDate()+(+m.recDias||0));if(d>hoje)return;dRec=d.toISOString().slice(0,10);}
      if(antesBase(dRec))return;
      s+=(+m.valor||0)*(1-(+m.taxa||0)/100);return;}
    if(m.tipo==='DESPESA'){if((m.conta||'')!==cb.nome)return;if(antesBase(m.data))return;if(m.status==='apagar'&&(m.data||'')>hojeISO)return;s-=(+m.valor||0);return;}
    if(m.tipo!=='COMPRA'||m.origem)return;
    if(m.pgTipo==='Parcelado'&&+m.nParc>0){
      /* nota parcelada = UM cronograma pela cabeça — MESMO filtro do a-pagar (só itens
         parcelados), senão item da nota editado pra à-vista desloca a cabeça e duplica */
      if(m.notaId){if(notasVistas[m.notaId])return;notasVistas[m.notaId]=1;
        const its=movs.filter(x=>x.tipo==='COMPRA'&&x.notaId===m.notaId&&!x.origem&&x.pgTipo==='Parcelado'&&+x.nParc>0);
        const h=its[0],tot=its.reduce((a,x)=>a+(+x.valor||0),0),nP=+h.nParc||1,vP=tot/nP,pg=h.pgParcelas||{};
        for(let i=1;i<=nP;i++){const p=pg[i];if(!p)continue;if(pagouDe(h,i)!==cb.nome)continue;if(antesBase(pgData(p)))continue;s-=pgValor(p,vP);}
        return;}
      const nP=+m.nParc||1,vP=(+m.valor||0)/nP,pg=m.pgParcelas||{};
      for(let i=1;i<=nP;i++){const p=pg[i];if(!p)continue;if(pagouDe(m,i)!==cb.nome)continue;if(antesBase(pgData(p)))continue;s-=pgValor(p,vP);}
      return;}
    if((m.conta||'')!==cb.nome)return;
    if(antesBase(m.data))return;
    s-=(+m.valor||0);});
  return Math.round(s*100)/100;}
/* Transferência entre contas / aporte externo / retirada — o gesto que faltava pro
   "tirei da conta pessoal pro negócio": dinheiro SEMPRE sai de um lugar e entra em outro.
   "fora do app" = dinheiro pessoal/externo (aporte quando entra, retirada quando sai).
   Não toca lucro/estoque/relatórios — só os saldos e extratos das contas. */
/* Migração pedida pelo Felype (2026-08-08): todo lançamento de dinheiro SEM conta vai pra
   conta "dinheiro" — ele cria as outras contas depois e corrige caso a caso. Campo era
   VAZIO antes (idempotente; "desfazer" = editar o lançamento). */
function migrarSemConta(){
  const alvo=movs.filter(m=>((m.tipo==='COMPRA'&&!m.origem)||m.tipo==='VENDA'||m.tipo==='DESPESA')&&!(m.conta||'').trim());
  if(!alvo.length){toast('Nenhum lançamento sem conta ✓');return;}
  const jaExiste=contasBanc.find(cb=>(cb.nome||'').trim().toLowerCase()==='dinheiro');
  const alvoNome=jaExiste?jaExiste.nome:'dinheiro';
  if(!confirm('Colocar '+alvo.length+' lançamento(s) sem conta na conta "'+alvoNome+'"?\n\nCompras pagas, vendas recebidas e despesas que hoje não apontam pra conta nenhuma passam a apontar pra "'+alvoNome+'". As outras contas você cria depois e corrige o que quiser (✏️ editar em cada lançamento). Nada é apagado.'))return;
  if(!jaExiste)contasBanc.push({id:novoId('cb'),nome:'dinheiro',saldoIni:null,saldoData:''});
  if(!pgs.includes(alvoNome))pgs.push(alvoNome);
  alvo.forEach(m=>m.conta=alvoNome);
  saveL();save();toast('✓ '+alvo.length+' lançamento(s) agora na conta "'+alvoNome+'"');render();}

   desconta inteira) — pro caixa físico: devolve as parcelas de COMPRA ainda não pagas e

function projecaoCaixa(){const hoje=new Date();hoje.setHours(0,0,0,0);
  const porEmissao=contasBanc.reduce((s,cb)=>s+saldoConta(cb),0);
  const ap=aPagar(),ar=aReceber();
  const pendCompra=ap.filter(x=>x.m&&x.m.tipo==='COMPRA').reduce((s,x)=>s+x.valor,0);
  const pendReceber=ar.reduce((s,x)=>s+x.valor,0);
  const fisico=Math.round((porEmissao+pendCompra-pendReceber)*100)/100;
  const em=d=>{const lim=new Date(hoje);lim.setDate(lim.getDate()+d);
    const p=ap.filter(x=>(x.venc||x.data)<=lim).reduce((s,x)=>s+x.valor,0);
    const r=ar.filter(x=>(x.venc||x.data)<=lim).reduce((s,x)=>s+x.valor,0);
    return Math.round((fisico+r-p)*100)/100;};
  const dt=d=>{const x=new Date(hoje);x.setDate(x.getDate()+d);return x.toLocaleDateString('pt-BR').slice(0,5);};
  return {atual:fisico,d30:em(30),d60:em(60),d90:em(90),dt30:dt(30),dt60:dt(60),dt90:dt(90),temContas:contasBanc.length>0};}

/* ── Scanner de carta (fase 1): foto → leitor local (arquivos no PRÓPRIO site, pasta ocr/)
   → lê o CÓDIGO na base da carta + detecta a ESCRITA (latina/japonesa/coreana/chinesa)
   → monta o código no padrão da casa (JP colado p/ japonesa OU coreana; C p/ chinesa)
   → mostra como SUGESTÃO com "✔ usar" — nunca aplica às cegas. O leitor (~20MB) só
   baixa na primeira vez que alguém escaneia; depois fica no cache do navegador. */
let _ocrWorker=null,_ocrCarregando=false;
function ocrWorker(cb){
  if(_ocrWorker){cb(_ocrWorker);return;}
  if(_ocrCarregando){setTimeout(()=>ocrWorker(cb),500);return;}
  _ocrCarregando=true;
  const s=document.createElement('script');s.src='ocr/tesseract.min.js';
  s.onload=async()=>{try{
    const base=location.origin+location.pathname.replace(/[^/]*$/,'')+'ocr';
    const w=await Tesseract.createWorker('eng',2,{workerPath:base+'/worker.min.js',corePath:base,langPath:base+'/lang'});
    _ocrWorker=w;_ocrCarregando=false;cb(w);
  }catch(e){_ocrCarregando=false;alert('Não consegui ligar o leitor de cartas: '+(String((e&&e.message)||e)).slice(0,80));cb(null);}};
  s.onerror=()=>{_ocrCarregando=false;alert('Não consegui baixar o leitor (ocr/). Confere a internet e tenta de novo.');cb(null);};
  document.head.appendChild(s);}
function escanearCod(codId,idiSelId,descId,valId,hintId){
  let inp=document.getElementById('scanFile');
  if(!inp){document.body.insertAdjacentHTML('beforeend','<input type="file" id="scanFile" accept="image/*" capture="environment" style="display:none">');inp=document.getElementById('scanFile');}
  inp.onchange=()=>{const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
    const hint=document.getElementById(hintId);if(hint)hint.innerHTML='📷 lendo… <span style="color:var(--mut)">(1ª vez baixa o leitor, ~20MB — depois é rápido)</span>';
    const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{
      const W=Math.min(1400,img.width),esc=W/img.width,H=Math.round(img.height*esc);
      const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.getContext('2d').drawImage(img,0,0,W,H);
      const baixo=document.createElement('canvas');const bh=Math.round(H*0.30);
      baixo.width=W;baixo.height=bh;baixo.getContext('2d').drawImage(cv,0,H-bh,W,bh,0,0,W,bh);
      const meio=document.createElement('canvas');const mh=Math.round(H*0.40);
      meio.width=W;meio.height=mh;meio.getContext('2d').drawImage(cv,0,Math.round(H*0.42),W,mh,0,0,W,mh);
      ocrWorker(async w=>{if(!w){if(hint)hint.innerHTML='';return;}
        try{
          await w.setParameters({tessedit_char_whitelist:'0123456789/JPC∞ '});
          const r=await w.recognize(baixo);
          await w.setParameters({tessedit_char_whitelist:''});
          const bruto=((r&&r.data&&r.data.text)||'').replace(/\s+/g,' ');
          const m=bruto.match(/(\d{1,3})\s*(JP|C)?\s*\/\s*(\d{1,3}|∞)/i);
          let escrita='latina';
          try{const d=await w.detect(meio);const sc=((d&&d.data&&d.data.script)||'')+'';
            if(/jap/i.test(sc))escrita='japonesa';else if(/hangul|kor/i.test(sc))escrita='coreana';else if(/^han|chin/i.test(sc))escrita='chinesa';}catch(e2){}
          if(!m){if(hint)hint.innerHTML='📷 Não achei o código — tente de novo com a BASE da carta bem visível e iluminada (ou digite à mão).';return;}
          const sufLido=(m[2]||'').toUpperCase(),num=m[1],tot=m[3];
          /* se a escrita foi cravada (ou o sufixo veio impresso), sugere direto; senão, 3 chips de 1 toque */
          const chip=(suf,rot,idi)=>{const c=num+suf+'/'+tot;
            return '<span class="lnk" style="font-weight:800;border:1px solid var(--blue);border-radius:8px;padding:2px 9px;display:inline-block;margin:2px 3px 0 0" onclick="aplicarScan(\''+codId+'\',\''+c+'\',\''+idiSelId+'\',\''+idi+'\',\''+hintId+'\')">'+rot+'</span>';};
          if(hint){
            if(sufLido||escrita!=='latina'){
              const suf=sufLido||((escrita==='japonesa'||escrita==='coreana')?'JP':'C');
              const cod=num+suf+'/'+tot;
              const idiSug=escrita==='japonesa'?'Japonês':escrita==='coreana'?'Coreano':escrita==='chinesa'?'Chinês':'';
              hint.innerHTML='📷 Li: <b>'+cod+'</b>'+(idiSug?' · escrita '+escrita:'')+' '+chip(suf,'✔ usar '+cod,idiSug)+' <span style="color:var(--mut)">· confira com a carta na mão</span>';
            }else{
              hint.innerHTML='📷 Li: <b>'+num+'/'+tot+'</b> — a carta é: '+chip('','normal','')+chip('JP','🇯🇵 japonesa','Japonês')+chip('JP','🇰🇷 coreana','Coreano')+chip('C','🇨🇳 chinesa','Chinês')+' <span style="color:var(--mut)">· 1 toque monta o código certo</span>';
            }}
        }catch(e3){if(hint)hint.innerHTML='📷 A leitura falhou ('+(((e3&&e3.message)||'')+'').slice(0,50)+') — tenta outra foto ou digita.';}
      });};img.src=e.target.result;};rd.readAsDataURL(f);};
  inp.click();}

/* Insere um símbolo que não existe no teclado (∞ dos códigos promocionais, ex. 032/∞)
   na posição do cursor, e dispara o evento de digitação pro assist reagir normal. */
function insSimbolo(inputId,ch){const el=document.getElementById(inputId);if(!el)return;
  const i=el.selectionStart??el.value.length,f=el.selectionEnd??el.value.length;
  el.value=el.value.slice(0,i)+ch+el.value.slice(f);
  el.focus();el.setSelectionRange(i+ch.length,i+ch.length);
  el.dispatchEvent(new Event('input',{bubbles:true}));}

/* Colar o link da carta (achada na Liga) → preenche nome e código sozinho, e guarda o link
   no item ao salvar (a coleta passa a acompanhar o valor por ele). O nome vem DENTRO da
   própria URL da Liga (parâmetro card=Nome (código)) — zero digitação. */
let _linkPend={};
function parseLinkLiga(url){try{const u=new URL(url);if(!/ligapokemon\.com\.br$/i.test(u.hostname.replace(/^www\./,'')))return null;
  const card=u.searchParams.get('card');if(!card)return null;
  const mm=card.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  return mm?{nome:mm[1].trim(),cod:mm[2].trim(),url}:{nome:card.trim(),cod:'',url};}catch(e){return null;}}
function colarLinkLiga(codId,descId,hintId){
  const u=prompt('Cole o LINK da página da carta na Liga (ache pelo 🔎, abra a carta certa, copie o endereço):','');
  if(u===null)return;const p=parseLinkLiga((u||'').trim());
  if(!p){alert('Não reconheci esse link — precisa ser o endereço de uma carta na ligapokemon.com.br.');return;}
  const codEl=document.getElementById(codId),descEl=document.getElementById(descId),hintEl=document.getElementById(hintId);
  if(codEl&&p.cod&&!codEl.value.trim())codEl.value=p.cod;
  if(descEl&&p.nome&&!descEl.value.trim())descEl.value=p.nome;
  _linkPend[codId]=p.url;
  if(hintEl)hintEl.innerHTML='🔗 <b>'+p.nome+'</b>'+(p.cod?' · #'+p.cod:'')+' <span style="color:var(--green)">— preenchi pelo link ✓ (valor: veja na página e digite no vale; a coleta acompanha por esse link)</span>';

/* União de 2 arrays de objetos por id (mapeado 2026-08-11 — caso 2 da corrida de saves, distinto
   do rascunho em tela tratado em lancarTemRascunho/aplicarNuvem acima). Local tem prioridade
   no empate (mesma id dos dois lados — edição concorrente do MESMO registro; caso raro, quem
   salva por último nessa id específica vence, mas só ESSA id, não o array inteiro). Sem isso,
   ids que só existem de um lado (o caso comum: cada aparelho lançou/cadastrou algo diferente
   na mesma janela) desapareciam de vez quando o outro lado fazia um .set() puro por cima.
   Genérico (não é só movs): serve pra qualquer array de objeto-com-id (movs, cadastros,
   contasBanc). */
function mergePorId(local,remoto){
  const byId={};
  (remoto||[]).forEach(m=>{if(m&&m.id)byId[m.id]=m;});
  (local||[]).forEach(m=>{if(m&&m.id)byId[m.id]=m;});
  return Object.values(byId);
}
/* União de 2 arrays de string (jogos/cats/cols/pess/pgs/despCats) — mesma filosofia do
   mergePorId, sem id: o valor É a chave. Preserva a 1ª ordem de aparição. */
function mergeArrUniao(local,remoto){
  const vistos=new Set(),out=[];
  (local||[]).concat(remoto||[]).forEach(v=>{if(v!=null&&v!==''&&!vistos.has(v)){vistos.add(v);out.push(v);}});
  return out;
}
/* União rasa de 2 dicionários chave->valor (codigosResolvidos) — local vence empate de chave,
   mesma convenção do mergePorId. */
function mergeDictRaso(local,remoto){return {...(remoto||{}),...(local||{})};}
/* colsJ = {jogo:[colecao,...]} — merge por jogo, e dentro de cada jogo une o array de coleções. */
function mergeColsJ(local,remoto){
  const out={};
  new Set([...Object.keys(local||{}),...Object.keys(remoto||{})]).forEach(j=>{out[j]=mergeArrUniao((local||{})[j],(remoto||{})[j]);});
  return out;
}
/* colsG = {jogo:{colecao:grupo}} — merge por jogo, e dentro de cada jogo merge raso colecao->grupo. */
function mergeColsG(local,remoto){
  const out={};
  new Set([...Object.keys(local||{}),...Object.keys(remoto||{})]).forEach(j=>{out[j]=mergeDictRaso((local||{})[j],(remoto||{})[j]);});
  return out;
}

/* Rascunho aberto no Lançar (editando um existente OU digitando um novo, ainda sem salvar)
   não pode ser apagado por um snapshot que chega de OUTRO aparelho — mapeado 2026-08-11:
   render() troca o innerHTML inteiro do #view, então os <input> em edição (que só guardam

/* [R1 2026-08-17] _lancarDirty: o caso real do Felype — preencheu data/produto/qualidade,
   criou um fornecedor novo pelo seletor, e o ECO da própria gravação na nuvem repintou o
   formulário, apagando tudo. A whitelist de 9 campos abaixo não segurava (data, qtd,
   condição, selects, bloco da nota — todos de fora). Whitelist "genérica por valor" daria
   falso-positivo permanente (selects/data vêm pré-preenchidos e nunca ficam vazios) — por
   isso a solução é uma FLAG DE INTERAÇÃO: qualquer digitação/mudança real do usuário no
   Lançar marca sujo; navegar pra fora ou salvar limpa. */
let _lancarDirty=false;
function lancarTemRascunho(){

function aplicarNuvem(d){if(!d||_restaurando)return;

     formulário em digitação. Snapshot de OUTRO aparelho tem _upd diferente e segue o

   U+267E às vezes seguido do seletor de variação U+FE0F), mas a Liga — e o botão ∞ do próprio
   app — usam o infinito MATEMÁTICO (∞, U+221E). Resultado real: "Mega Gardevoir ex (032/♾️)"
