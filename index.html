<script>

  authDomain: "controle-tcg.firebaseapp.com",
  projectId: "controle-tcg",

  messagingSenderId: "1055834697410",

};
const EMAILS_OK = ['felypexykawa@gmail.com','pokecentertcgoficial@gmail.com','projetofelype@gmail.com']; /* Felype + Laura (acesso total) + e-mail de teste do Felype (restrito, de propósito). Adicionar mais e-mails aqui quando quiser. */
/* Perfis de acesso (Felype pediu, 2026-08-10; default invertido 2026-08-10 a pedido dele —
   "restrito é pra e-mail NOVO"): e-mail SEM entrada aqui cai em 'lancamento' (restrito) por
   padrão — o oposto de antes. Só quem está listado abaixo com 'admin' tem acesso total.
   Isso é mais seguro por padrão: um e-mail novo adicionado no futuro nunca herda acesso
   total sem alguém decidir isso explicitamente aqui. GATING DE INTERFACE, não é segurança
   de verdade — quem souber abrir o console do navegador contorna (não tem regra de
   Firestore por papel, só por e-mail estar em EMAILS_OK); serve pra não confundir/expor
   sem querer, não pra blindar contra alguém mal-intencionado — ver backlog sobre isso. */
const PAPEL_POR_EMAIL = {'felypexykawa@gmail.com':'admin','pokecentertcgoficial@gmail.com':'admin'};
function papelAtual(){if(!_userEmail)return 'admin';return PAPEL_POR_EMAIL[_userEmail.toLowerCase()]||'lancamento';}
const USAR_NUVEM = !!(firebaseConfig && firebaseConfig.apiKey);
let _db=null,_auth=null,_syncReady=false,_userEmail='',_restaurando=false;
let _localCheio=false;   /* [revisor G1-classe, G-5] içado: o 1º gravaLocal do boot rodava ANTES da declaração (TDZ) e memória cheia matava o app na abertura */
let _avisoVersaoVelha=false;   /* aviso "recarregue" 1x quando um snapshot vier de app mais novo */
/* _upd do último snapshot remoto que ESTE aparelho realmente aplicou — usado por salvarNuvem()
   pra saber se alguém salvou por cima entre a última leitura e agora (corrida de 2 saves,
   mapeado 2026-08-11: ver comentário completo em salvarNuvem). */
let _ultimoUpdAplicado=0;
/* [F0 22/08 — lançamento feito SEM INTERNET não pode sumir quando a rede volta]
   Até aqui: sem rede, salvarNuvem falhava (a transação exige servidor) e o lançamento vivia só
   neste aparelho; se o OUTRO aparelho salvasse qualquer coisa antes do próximo save daqui, o
   snapshot dele chegava com _upd diferente e aplicarNuvem SUBSTITUÍA os movs — o lançamento
   feito sem rede sumia em silêncio (reproduzido pelo revisor do mundo real contra o arquivo do
   ar, 22/08). Contador de "mudança local ainda não confirmada na nuvem": save()/saveL() avançam
   _pendSeq; a transação captura o valor quando monta o payload e, no commit, limpa até ali
   (dois saves em voo: o commit do 1º NÃO limpa o 2º). Persistido em localStorage porque o caso
   real inclui FECHAR o app sem rede e reabrir com rede — sem a marca no disco, o 1º snapshot do
   boot substituiria os movs locais e o lançamento de ontem sumiria do mesmo jeito.
   Consumidor: aplicarNuvem — com pendência, FUNDE (mesma regra do salvarNuvem: túmulos primeiro,
   local vence no empate de id) em vez de substituir, e sobe a união em seguida. */
let _pendSeq=0,_pendOk=0;
let _pendDesde=0;   /* [revisão F3, médio 1] desde quando há pendência sem confirmação (0 = nenhuma) — só pendência VELHA (>10 s) vale como "sem internet"; a fresca é o commit normal em voo */
try{if(localStorage.getItem('tcg_pend_nuvem')==='1'){_pendSeq=1;_pendDesde=Date.now();}}catch(e){}
/* [revisão 23/08, G2] a marca passa pelo gravaLocal — é 1 byte, e com a cota cheia o setItem
   cru engolia o erro: o lançamento ficava no disco e a marca não; ao reabrir, o 1º snapshot
   substituía e o lançamento sem rede sumia calado. Pelo gravaLocal a poda abre espaço e, se
   nem assim couber, o dono é avisado. */
function marcaPendNuvem(){if(!pendNuvem())_pendDesde=Date.now();_pendSeq++;gravaLocal('tcg_pend_nuvem','1');}
function pendNuvem(){return _pendSeq>_pendOk;}
/* pendência VELHA = nada confirmado há mais de 10 s: é o sinal de "sem internet" que o modo avião não dá (wifi sem rede) */
function pendNuvemVelha(){return pendNuvem()&&_pendDesde>0&&(Date.now()-_pendDesde)>10000;}
function limpaPendNuvem(seq){if(seq>_pendOk)_pendOk=seq;if(!pendNuvem()){_pendDesde=0;try{localStorage.removeItem('tcg_pend_nuvem');}catch(e){}}}
/* [re-checagem 23/08, N1] BASE CONFIRMADA: o que a nuvem confirmou por último, por registro (hash). A
   regra "remoto vence o empate" sozinha rasgava operação composta feita sem rede: a baixa de lote edita
   o PAI (id dos dois lados → voltava ao valor da nuvem) e cria o FILHO (id novo → ficava) — estoque e
   custo inventados (10 vira 13 unidades), subindo pra nuvem. Com a base: id compartilhado cujo hash
   local ≠ base = "mudei AQUI desde a última confirmação" → local vence; hash igual = "não mexi" → remoto
   vence (cópia local pode ser velha; G1 continua curado). Gravada após todo commit bem-sucedido e todo
   snapshot aplicado sem pendência. Sem entrada na base (1ª sessão depois da atualização): o pai
   referenciado por registro que só existe aqui (loteOrigem/origemId/vendaRef) ainda vence. */
let _baseH={};try{_baseH=JSON.parse(localStorage.getItem('tcg_base_h')||'{}')||{};}catch(e){_baseH={};}
/* [re-checagem 2, N3] o replacer é FUNÇÃO que ordena as chaves em QUALQUER profundidade. A 1ª versão
   passava um array de chaves, que o JSON.stringify trata como lista de PERMITIDAS em todos os níveis:
   objeto aninhado (pgParcelas — parcela paga) virava {} e a base não via a mudança. */
function hashReg(o){if(o&&o.fotoThumb){const c={...o};delete c.fotoThumb;o=c;}   /* [1MB fase 1] miniatura é derivada e não viaja mais no documento — se entrasse no hash, todo lançamento com foto pareceria "editado aqui" pra sempre e a base viraria a doença dos 40/40 de novo */
  const s=JSON.stringify(o,(k,v)=>(v&&typeof v==='object'&&!Array.isArray(v))?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36);}
/* [1MB fase 1, 25/08] a miniatura (fotoThumb, ~2KB por lançamento com foto) era o único campo que
   crescia POR FOTO dentro do documento de 1MB. Agora: (a) o payload sobe enxuto (semThumbs);
   (b) o snapshot que chega sem thumb NÃO apaga a miniatura local (reidrataThumbs, só quando o
   lançamento ainda tem foto); (c) a miniatura viaja em doc próprio `th_{movId}` DENTRO da
   subcoleção `fotos` — a regra já publicada cobre, id de foto começa com 'f', sem colisão. */
/* [revisor 1MB, G1] o payload NAO apaga a chave: sobe um MARCADOR de 1 pixel (75 bytes). Apagar fazia o
   aparelho DESATUALIZADO ver hash(local com thumb) != base(doc sem thumb) e concluir "editei aqui" em todo
   lancamento com foto — vencendo merges com copia velha e SUBINDO reversao de edicao (provado: 777 virava 20).
   Com o marcador, o valor que o velho recebe e estavel dos dois lados e o hash dele fecha. */
const TH_MARCA='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function semThumbs(arr){return (arr||[]).map(m=>{if(m&&m.fotoThumb&&m.fotoThumb!==TH_MARCA){const c={...m};c.fotoThumb=TH_MARCA;return c;}return m;});}
function reidrataThumbs(antes,depois){if(!Array.isArray(antes)||!Array.isArray(depois))return depois;
  const t={};antes.forEach(m=>{if(m&&m.id&&m.fotoThumb&&m.fotoThumb!==TH_MARCA)t[m.id]=m.fotoThumb;});
  depois.forEach(m=>{if(!m||!m.id)return;
    if(m.fotoThumb===TH_MARCA){if(t[m.id]&&(+m.nFotos||0)>0)m.fotoThumb=t[m.id];else if(!((+m.nFotos||0)>0))delete m.fotoThumb;}   /* [revisor G1, rodada 2] com foto e sem par local o marcador FICA (invisivel na tela): apagar fazia o campo oscilar real->marcador->ausente no doc, e cada troca era transicao nova pro aparelho velho. Sem foto nenhuma (nFotos=0), marcador e lixo e sai */
    else if(!m.fotoThumb&&t[m.id]&&(+m.nFotos||0)>0)m.fotoThumb=t[m.id];});
  return depois;}
function thumbReal(x){return (x&&x!==TH_MARCA)?x:'';}   /* a tela so mostra miniatura DE VERDADE; marcador = sem miniatura */
function calcBase(p){const b={};[p&&p.movs,p&&p.cadastros,p&&p.contasBanc].forEach(L=>{(L||[]).forEach(r=>{if(r&&r.id)b[r.id]=hashReg(r);});});return b;}
function publicaBase(b){if(!b)return;_baseH=b;gravaLocal('tcg_base_h',JSON.stringify(b));}
function gravaBaseConfirmada(p){publicaBase(calcBase(p));}
function mergePorIdBase(local,remoto){const byId={};(remoto||[]).forEach(m=>{if(m&&m.id)byId[m.id]=m;});
  /* resgate SEM base (1ª sessão depois da atualização, com alteração já pendente no disco): id
     compartilhado que é alvo de registro só-local (loteOrigem/origemId/vendaRef) ou que divide a
     MESMA troca (trocaId) com um registro só-local faz parte de operação feita aqui → local vence.
     [re-checagem 2, N4] sem o trocaId o item dado voltava a "Em estoque" e o recebido ficava:
     patrimônio inflado. */
  const refLocal=new Set(),trocasLocais=new Set();
  (local||[]).forEach(m=>{if(!m||!m.id||byId[m.id])return;[m.loteOrigem,m.origemId,m.vendaRef].forEach(x=>{if(x)refLocal.add(x);});if(m.trocaId)trocasLocais.add(m.trocaId);});
  (local||[]).forEach(m=>{if(!m||!m.id)return;const rem=byId[m.id];
    if(!rem){byId[m.id]=m;return;}
    const b=_baseH[m.id];
    if(b!==undefined){if(hashReg(m)!==b)byId[m.id]=m;}
    else if(refLocal.has(m.id)||(m.trocaId&&trocasLocais.has(m.trocaId)))byId[m.id]=m;});
  return Object.values(byId).filter(m=>!estaExcluido(m&&m.id));}
const MK='tcg_movs_v2';
const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};

/* [CAUSA RAIZ 2026-08-20 — "a Laura exclui e volta tudo"; erro meu, de 11/08]
   A proteção contra dois aparelhos salvando ao mesmo tempo funde as listas por id. Só que
   exclusão era expressa por AUSÊNCIA — e unir "ausente aqui" com "presente lá" dá PRESENTE.
   Resultado: quem exclui perde a exclusão sempre que alguém tiver mexido na nuvem no meio
   (outra aba, o outro aparelho, o eco da própria escrita). Vira loteria: um item some, o
   outro volta — exatamente o que eles viveram. O revisor me avisou disso na época e eu
   registrei como "risco residual aceitável"; não era.
   CURA: exclusão passa a ser um FATO GRAVADO, não uma ausência. Cada id excluído fica aqui
   com a data, o registro sobe pra nuvem junto e o merge respeita: id que está aqui não
   ressuscita, venha de onde vier. Limpeza automática depois de 120 dias (a essa altura o
   outro aparelho já sincronizou muitas vezes; guardar pra sempre incharia o documento). */
let excluidos=get('tcg_excluidos',{});

/* [cura de classe 25/08 — revisor-lixeira G1] a RESTAURAÇÃO deixou de viajar como ausência: desmarcar grava uma
   marca NEGATIVA (-agora) no lugar de apagar a chave. Na fusão entre aparelhos vence o evento de |ts| maior
   (mergeExcl) — o aparelho atrasado que ainda carrega o túmulo velho não devora mais o item restaurado. */
function desmarcaExcluido(...ids){let mexeu=false;const t=agoraExcl();
  ids.flat().forEach(id=>{if(id&&excluidos[id]&&+excluidos[id]>0){excluidos[id]=-t;mexeu=true;}});
  if(mexeu)gravaLocal('tcg_excluidos',JSON.stringify(excluidos));return mexeu;}
function esqueceExclusaoDe(o){if(!o)return;
  const ids=[];
  (Array.isArray(o.movs)?o.movs:[]).forEach(m=>{if(m&&m.id)ids.push(m.id);});
  (Array.isArray(o.cadastros)?o.cadastros:[]).forEach(c=>{if(c&&c.id)ids.push(c.id);});
  (Array.isArray(o.contasBanc)?o.contasBanc:[]).forEach(c=>{if(c&&c.id)ids.push(c.id);});
  (Array.isArray(o.pess)?o.pess:[]).forEach(n=>{if(n)ids.push('pess:'+n);});
  (Array.isArray(o.pgs)?o.pgs:[]).forEach(n=>{if(n)ids.push('pgs:'+n);});
  (Array.isArray(o.jogos)?o.jogos:[]).forEach(n=>{if(n)ids.push('jogos:'+n);});
  (Array.isArray(o.cols)?o.cols:[]).forEach(n=>{if(n)ids.push('cols:'+n);});
  /* [fotos D1] restaurar traz os grupos de volta: desmarca os túmulos de nota/venda/troca dos lançamentos que voltam */
  (Array.isArray(o.movs)?o.movs:[]).forEach(m=>{if(!m)return;if(m.notaId)ids.push('nota:'+m.notaId);if(m.vendaId)ids.push('venda:'+m.vendaId);if(m.trocaId)ids.push('troca:'+m.trocaId);});
  desmarcaExcluido(ids);}
/* [revisor G1-classe, G-4] carimbo MONOTÔNICO: um evento novo sempre vence todo evento já conhecido neste
   aparelho, mesmo com relógio atrasado (senão excluir DEPOIS de uma restauração perdia por hora de relógio). */
function agoraExcl(){let m=0;for(const k in excluidos){const a=Math.abs(+excluidos[k]||0);if(a>m)m=a;}return Math.max(Date.now(),m+1);}
function marcaExcluido(...ids){const t=agoraExcl();ids.flat().forEach(id=>{if(id)excluidos[id]=t;});podaExcluidos();gravaLocal('tcg_excluidos',JSON.stringify(excluidos));}
/* [decisão do Felype, 25/08: "se eu excluí aquele lançamento, então eu excluí a foto também"] Quando um túmulo
   completa 120 dias (o prazo em que restaurar ainda devolve tudo) e vai ser esquecido, o DONO dele entra na fila
   de limpeza — as fotos são apagadas de vez (nuvem/aparelho) pela varredura de fundo. A fila fica no disco. */
let _fotosPurga=[];try{const fp=JSON.parse(localStorage.getItem('tcg_fotos_purga')||'[]');if(Array.isArray(fp))_fotosPurga=fp.filter(x=>typeof x==='string'&&x);}catch(e){}
function gravaFotosPurga(){try{gravaLocal('tcg_fotos_purga',JSON.stringify(_fotosPurga));}catch(e){}}
function podaExcluidos(){
  /* [revisor G1-classe, M-A] idade contada a partir do MAIOR carimbo conhecido (não só do relógio local):
     um aparelho com data adiantada carimbava o futuro, o futuro nunca "envelhecia" e a poda parava —
     túmulo imortal e foto de lançamento excluído nunca entrava na fila de limpeza */
  let ref=Date.now();for(const k in excluidos){const a=Math.abs(+excluidos[k]||0);if(a>ref)ref=a;}
  const lim=ref-120*864e5;let mudou=false;
  Object.keys(excluidos).forEach(k=>{const v=+excluidos[k]||0;if(!(Math.abs(v)>lim)){
    /* só EXCLUSÃO velha (positiva) alimenta a limpeza de fotos; marca de restauração velha só sai do mapa */
    if(v>0){const dono=k.replace(/^(nota|venda|troca):/,'');
      if(dono&&!_fotosPurga.includes(dono)){_fotosPurga.push(dono);mudou=true;}}
    delete excluidos[k];}});
  if(mudou)gravaFotosPurga();}
/* varredura de fundo: poucas por vez; leitura falhada deixa pra próxima; com nuvem ligada e sem login, espera */
function processarPurgaFotos(){if(!_fotosPurga.length)return;if(USAR_NUVEM&&!_db)return;
  _fotosPurga.slice(0,3).forEach(dono=>{
    /* [revisão F5a, G3] dono que VOLTOU a existir (restaurado, importado, fusão, id reaproveitado) sai da fila
       SEM apagar nada — a purga só limpa quem está morto de verdade no momento da varredura */
    if(movs.some(x=>x.id===dono||x.notaId===dono||x.vendaId===dono||x.trocaId===dono)){_fotosPurga=_fotosPurga.filter(x=>x!==dono);gravaFotosPurga();return;}
    fotoList(dono,L=>{if(L===null)return;
    if(!L.length){_fotosPurga=_fotosPurga.filter(x=>x!==dono);gravaFotosPurga();lixeiraApaga(dono,function(){});thumbNuvem(dono,null);return;}   /* [revisão lixeira, G2] dono SEM foto também tem a entrada apagada aos 120 dias */
    let falta=L.length,todas=true;
    L.forEach(f=>fotoDel(f.id,ok=>{if(!ok)todas=false;if(--falta===0&&todas){_fotosPurga=_fotosPurga.filter(x=>x!==dono);gravaFotosPurga();lixeiraApaga(dono,function(){});thumbNuvem(dono,null);}}));});});}   /* o doc th_ do dono morre junto (grupo sem th_ = delete inofensivo) */
/* ===== 🗑 LIXEIRA — decisão do Felype 25/08: o campo de USO da janela de 120 dias =====
   Guarda o LANÇAMENTO COMPLETO fora do documento principal (subcoleção `lixeira` na nuvem; cofre local no modo
   local) no momento da exclusão. A tela 🗑 Lixeira (em Backup) lista, mostra fotos e RESTAURA item a item; a

   confirmou no aviso) — vira toast, e os pontos de restauração continuam cobrindo. */
function lixeiraRef(){return _db?_db.collection('controle').doc('dados').collection('lixeira'):null;}
function lixeiraGuarda(removidos){try{const L=(removidos||[]).filter(m=>m&&m.id);if(!L.length)return;
  const quem=(_userEmail||'').split('@')[0]||'';const ts=Date.now();
  if(USAR_NUVEM){const ref=lixeiraRef();if(!ref)return;
    L.forEach(m=>{ref.doc(m.id).set({ts,quem,mov:m}).catch(()=>{try{toast('⚠ não consegui guardar "'+rotDe(m)+'" na lixeira (sem internet?) — se precisar, restaure por um ponto');}catch(e){}});});return;}
  idbOpen(db=>{if(!db)return;try{const tx=db.transaction('lixeira','readwrite');L.forEach(m=>tx.objectStore('lixeira').put({id:m.id,ts,quem,mov:m}));}catch(e){}});
  }catch(e){try{toast('⚠ não consegui guardar na lixeira — se precisar, restaure por um ponto');}catch(_){}}}   /* [revisão lixeira, M3] throw síncrono nunca trava a exclusão */
function lixeiraLista(cb){
  if(USAR_NUVEM){const ref=lixeiraRef();if(!ref){cb(null);return;}
    ref.orderBy('ts','desc').limit(200).get().then(q=>{if(q&&q.metadata&&q.metadata.fromCache&&q.empty){cb(null);return;}const L=[];q.forEach(d=>L.push(Object.assign({id:d.id},d.data())));cb(L);}).catch(()=>cb(null));return;}
  idbOpen(db=>{if(!db){cb(null);return;}try{const L=[];const cur=db.transaction('lixeira').objectStore('lixeira').openCursor();
    cur.onsuccess=e=>{const c=e.target.result;if(c){L.push(c.value);c.continue();}else{L.sort((a,b)=>(b.ts||0)-(a.ts||0));cb(L);}};cur.onerror=()=>cb(null);}catch(e){cb(null);}});}
function lixeiraApaga(id,cb){
  if(USAR_NUVEM){const ref=lixeiraRef();if(!ref){cb&&cb(false);return;}ref.doc(id).delete().then(()=>cb&&cb(true)).catch(()=>cb&&cb(false));return;}
  idbOpen(db=>{if(!db){cb&&cb(false);return;}try{const tx=db.transaction('lixeira','readwrite');tx.objectStore('lixeira').delete(id);tx.oncomplete=()=>cb&&cb(true);tx.onerror=()=>cb&&cb(false);}catch(e){cb&&cb(false);}});}
let _lixCache=null;
function lixeiraRestaura(id){const e=(_lixCache||[]).find(x=>x.id===id);
  if(!e||!e.mov){alert('Não achei esse item na lixeira agora — feche e abra a Lixeira de novo.');return;}
  if(movs.some(x=>x.id===id)){lixeiraApaga(id,function(){});toast('Esse lançamento já está de volta no app — limpei a entrada da lixeira.');abrirLixeira();return;}
  const m=e.mov;
  /* venda cuja exclusão devolveu produto ao estoque: restaurar a venda NÃO baixa o estoque de novo — avisar antes */
  if(m.tipo==='VENDA'&&m.origemId&&!confirm('Esta é uma VENDA que tinha produto vinculado. Se na exclusão o produto voltou pro estoque, restaurar a venda NÃO baixa o estoque de novo — confira o item depois.\n\nRestaurar mesmo assim?'))return;
  movs.push(m);
  desmarcaExcluido([m.id,m.notaId?'nota:'+m.notaId:null,m.vendaId?'venda:'+m.vendaId:null,m.trocaId?'troca:'+m.trocaId:null].filter(Boolean));
  _fotosPurga=_fotosPurga.filter(x=>x!==m.id&&x!==m.notaId&&x!==m.vendaId&&x!==m.trocaId);gravaFotosPurga();
  /* [revisão lixeira, G1] a ENTRADA FICA: a restauração viaja como ausência de túmulo e a fusão com um aparelho
     que ainda carrega o túmulo antigo pode devorar o item de volta — enquanto a cura de classe (túmulo com sinal)
     não entra, a entrada preservada garante que dá pra restaurar DE NOVO. A tela mostra "já está de volta" e a
     limpeza dos 120 dias apaga a entrada no fim. */
  save();diarioReg('restaurou da lixeira',rotDe(m));toast('↩ Restaurado — '+rotDe(m)+' voltou pros seus números');abrirLixeira();}

/* ===== F4 — RASCUNHO PERSISTENTE do Lançar (25/08; cura da queixa de 21/08 "fechei a aba e perdi o que digitava") =====
   Guarda no APARELHO (IDB 'rascunho', doc 'atual') as listas e os baldes do Lançar a cada mudança (debounce ~400 ms,
   disparado pelo render — todo gesto de lista/balde passa por ele). Restaura na abertura se houver conteúdo real;
   NUNCA restaura a tela. Limpa nos salvamentos e no apagar tudo. Por aparelho de propósito (rascunho é de quem digita);
   iOS pode descartar IDB por inatividade — limite declarado. O gate _rascPronto impede o render do boot de gravar um
   rascunho VAZIO por cima do real antes de a restauração terminar. */
let _rascTimer=null,_rascPronto=false;
function dadosRascunho(){return {tipoSel,compraModo,vendaModo,notaItens,vendaItens,trocaDei,trocaRecebi,trocaDin,_fotosItem,_fotosPend,ts:Date.now()};}
function temRascunho(d){if(!d)return false;return !!((d.notaItens&&d.notaItens.length)||(d.vendaItens&&d.vendaItens.length)||(d.trocaDei&&d.trocaDei.length)||(d.trocaRecebi&&d.trocaRecebi.length)||(d._fotosItem&&d._fotosItem.length)||(d._fotosPend&&d._fotosPend.length)||(+d.trocaDin));}

/* ============ EXCLUSAO COM LASTRO (2026-08-20) ============
   Regra do dono: "quando exclua, exclua mesmo" - e a unidade de exclusao e a COMPRA INTEIRA,
   nao o pedaco clicado: excluir estoque leva o pedido do mesmo produto junto. Todo caminho
   passa por um aviso em TELA dizendo o que vai acontecer, com as saidas nomeadas pela
   consequencia - nunca por confirm() encadeado (aviso curto pra acao grave era o pior
   defeito da versao anterior). */
function praRot(v){return v==='Coleção'?'pra coleção':v==='Pedido'?'pro pedido (a caminho)':'pro estoque';}
function doRot(v){return v==='Coleção'?'da coleção':v==='Pedido'?'do pedido':'do estoque';}
function noRot(v){return v==='Coleção'?'na coleção':v==='Pedido'?'no pedido':'no estoque';}
function rotDe(m){return (m&&m.colecao?m.colecao+' · ':'')+((m&&m.cat)||'item');}
function dataBRde(m){try{return m&&m.data?dBR(new Date(m.data+'T00:00:00')):'—';}catch(e){return '—';}}
/* acha o pedaco de estoque que saiu nesta venda. vendaRef e o vinculo gravado na criacao
   (deterministico); a heuristica de data/qtd/custo so entra pro legado sem esse campo. */
function pecaDaVenda(v){if(!v||!v.origemId)return null;
  const direto=movs.find(x=>x.tipo==='COMPRA'&&x.vendaRef===v.id);
  if(direto)return direto;
  const alvo=movs.find(x=>x.id===v.origemId);if(!alvo)return null;
  if(sitDe(alvo)==='Vendido')return alvo;
  const cands=movs.filter(x=>x.loteOrigem===alvo.id&&sitDe(x)==='Vendido'&&x.dataVenda===v.data&&(+x.qtd||1)===(+v.qtd||1)&&Math.abs((+x.valor||0)-(+v.custoOrigem||0))<0.02&&!movs.some(o=>o.tipo==='VENDA'&&o.origemId===x.id));
  return cands.length?cands[0]:null;}
/* Pra onde o pedaço volta quando a venda é desfeita. Pedaço vendido ANTES de chegar (vendaDe 'pedido') volta pro
   pedido — MAS só se a chegada ainda não foi confirmada: com `dataChegada` gravada (chegouPeca) ele já está
   fisicamente na mão, e voltar pra 'Pedido' o tirava do estoque e o mandava pra "Ainda sem comprador" (19/09/2026,
   achado do agente de testes). */
function voltaDe(v,peca){return (v&&v.vendaTipo==='colecao')?'Coleção':((v&&v.vendaDe==='pedido'&&!(peca&&peca.dataChegada))?'Pedido':'Em estoque');}
/* devolve o pedaco pro lugar de onde saiu (estoque, pedido ou colecao) */
function voltarPeca(peca,v){
  const volta=voltaDe(v,peca);
  peca.situacao=volta;peca.destino=volta==='Coleção'?'Coleção':'Vender';
  delete peca.dataVenda;delete peca.dataSaida;delete peca.vendaRef;
  return volta;}
/* familia inteira a partir da RAIZ: o lote original, todos os pedacos que sairam dele
   (e pedacos de pedacos) e as vendas penduradas em qualquer um deles. */
function famDe(id){const m0=movs.find(x=>x.id===id);if(!m0)return null;
  const raiz=raizDe(m0)||m0;const fam=[raiz];let mudou=true,g=0;
  while(mudou&&g++<25){mudou=false;
    movs.forEach(x=>{if(x.loteOrigem&&fam.indexOf(x)<0&&fam.some(f=>f.id===x.loteOrigem)){fam.push(x);mudou=true;}});}
  const ids={};fam.forEach(x=>ids[x.id]=1);
  const vendas=movs.filter(x=>x.tipo==='VENDA'&&ids[x.origemId]);
  const por=st=>fam.filter(x=>sitDe(x)===st);
  return {raiz:raiz,fam:fam,vendas:vendas,
    saiu:fam.filter(x=>sitDe(x)==='Vendido'||sitDe(x)==='Trocado'),
    estoque:por('Em estoque'),pedido:por('Pedido'),colecao:por('Coleção'),
    abertos:por('Aberto')};}
/* mesma regra do motor(): 'Aberto' e 'Trocado' NAO entram no custo — o valor deles ja
   foi redistribuido nos pedacos filhos, somar os dois conta o mesmo dinheiro duas vezes. */
const somaV=a=>a.reduce((s,x)=>{const st=sitDe(x);return (st==='Aberto'||st==='Trocado')?s:s+(+x.valor||0);},0);
const somaVBruta=a=>a.reduce((s,x)=>s+(+x.valor||0),0);
const somaQ=a=>a.reduce((s,x)=>s+(+x.qtd||1),0);

/* --------- executor unico: toda saida passa por aqui e REGISTRA a exclusao --------- */
function execExcl(id,modo){fecharModal();const m=movs.find(x=>x.id===id);if(!m)return;
  const some=lista=>{const st={};[].concat(lista).forEach(x=>{if(x)st[x]=1;});
    const removidos=movs.filter(x=>st[x.id]);
    marcaExcluido(Object.keys(st));movs=movs.filter(x=>!st[x.id]);
    enterraGruposVazios(removidos);   /* [fotos D1 / revisão F2] venda/nota/troca que ficou sem item ganha túmulo (comprovante com rastro) */
    lixeiraGuarda(removidos);
    if(removidos.length>3)diarioReg('excluiu (lote)',removidos.length+' lançamentos');else removidos.forEach(m=>diarioReg('excluiu',rotDe(m),m.tipo||''));   /* [lixeira 25/08 + revisor-diario G1] restaurável 120 dias; lote = UM registro */};
  if(modo==='serie'){const alvos=movs.filter(x=>x.serieId===m.serieId&&x.data>=m.data&&x.status==='apagar');
    some(alvos.map(x=>x.id));save();render();toast(alvos.length+' previsão(ões) apagada(s)');return;}
  if(modo==='so'){some([m.id]);save();render();toast('Lançamento apagado');return;}
  if(modo==='vendaSo'){some([m.id]);save();render();toast('Venda apagada');return;}
  if(modo==='vendaVolta'){const pc=pecaDaVenda(m);const volta=pc?voltarPeca(pc,m):null;
    some([m.id]);save();render();
    toast(volta?'Venda apagada — produto voltou '+praRot(volta)+' ✓':'Venda apagada');return;}
  if(modo==='vendaTudo'){const pc=pecaDaVenda(m);
    some([m.id].concat(pc?[pc.id]:[]));save();render();toast('Venda e produto apagados');return;}
  if(modo==='compraTudo'){const f=famDe(id);if(!f)return;
    const n=f.fam.length+f.vendas.length;
    some(f.fam.map(x=>x.id).concat(f.vendas.map(x=>x.id)));save();render();
    toast('Apagados '+n+' registro(s) — a compra inteira');return;}
  if(modo==='compraSobra'){const f=famDe(id);if(!f)return;
    const fica={};f.saiu.forEach(x=>fica[x.id]=1);
    /* religar cada venda no pedaco que fica: sem isto ela apontaria pro lote-pai apagado */
    f.vendas.forEach(v=>{const pc=pecaDaVenda(v);if(pc&&fica[pc.id]){v.origemId=pc.id;pc.vendaRef=v.id;}});
    /* pedaco que fica vira raiz propria: sem pai, a conservacao passa a valer contra a
       SUBFAMILIA que sobreviveu (nao contra o valor dele sozinho) — senao a prova real fica
       vermelha logo depois de uma acao que o proprio app ofereceu. */
    const subSoma=raizId=>{let t=0;const fila=[raizId];const visto={};
      while(fila.length){const id=fila.shift();if(visto[id])continue;visto[id]=1;
        const it=movs.find(y=>y.id===id);if(it&&fica[id])t+=(+it.valor||0);
        f.fam.forEach(y=>{if(y.loteOrigem===id&&fica[y.id])fila.push(y.id);});}
      return Math.round(t*100)/100;};
    f.saiu.forEach(x=>{if(!fica[x.loteOrigem]){delete x.loteOrigem;x.valorOrig=subSoma(x.id);}});
    some(f.fam.filter(x=>!fica[x.id]).map(x=>x.id));save();render();
    toast('Apagado o que não vendeu — '+f.vendas.length+' venda(s) mantida(s)');return;}}

   (o template literal emite a quebra de verdade). Regra da casa desde 21/08: acao com aviso

/* CLIQUE QUE PARECE NAO TER PEGADO (Felype, 21/08): "clica em salvar a venda e parece que
   nao foi porque o aplicativo nao reage... quando tu ve, salvou 3 vendas". Nao e incomodo
   visual: e DUPLICACAO DE DADO. No celular a tela leva um instante pra repintar depois de
   gravar, e nesse instante o botao antigo ainda esta la, clicavel.

   Duas metades, as duas necessarias:
     (1) o segundo toque no MESMO botao dentro de 900ms nao executa (e avisa por que);
     (2) o primeiro toque marca o botao na hora (opacidade + ampulheta), pra a pessoa VER que
         pegou — sem isso ela continua com motivo pra tocar de novo, e a guarda so esconderia
         o sintoma.

   Por captura no document: nenhum botao precisa ser alterado e botao NOVO ja nasce protegido.
   Fora da lista de proposito: os "+ adicionar" e a navegacao — la tocar duas vezes rapido e
   uso legitimo. */
const RE_GRAVA=/\b(salvar|salvarNota|salvarVendaVarios|salvarTroca|salvarTransferencia|salvarCadastro|salvarConta|salvarEdicaoNota|salvarPontoNuvem|excluir|excluirPess|excluirCadastro|excluirConta|excluirCol|excluirJogo|excluirNotaInteira|desfazerNotaFaz|separarDaNotaFaz|moverFotosDe|moverFotoPara|lixeiraRestaura|lixeiraApaga|reenviarFotosFalhadas|execExcl|execDev|devolver|limparTudo|aplicarScan|aplicarOrigem|aplicarMesmaCompra|aplicarHistoricasMassa|confirmarPagarParcela|marcarPago|chegouPedido|restaurarBackup|restaurarPontoNuvem|desfazerNota|desvincular|baixarLote)\s*\(/;
/* a chave e o ATRIBUTO inteiro (funcao + argumentos), nao o elemento. Se a tela repintar
   entre um toque e outro, o botao novo e outro ELEMENTO mas tem o mesmo atributo — pela
   identidade do elemento o segundo toque passaria e a venda entraria 2x assim mesmo. Usar os
   argumentos na chave mantem legitimo apagar dois itens diferentes em seguida. */
let _ultToque={chave:null,ts:0};
(function(){try{
  document.addEventListener('click',function(ev){
    let el=null;
    try{el=ev.target&&ev.target.closest?ev.target.closest('[onclick]'):null;}catch(e){}
    if(!el)return;
    const attr=el.getAttribute('onclick')||'';
    if(!RE_GRAVA.test(attr))return;
    const agora=Date.now();
    if(_ultToque.chave===attr&&agora-_ultToque.ts<900){
      ev.preventDefault();ev.stopImmediatePropagation();
      try{toast('já registrei esse toque — só um instante');}catch(e){}
      return;}
    _ultToque={chave:attr,ts:agora};
    try{el.classList.add('agindo');
      setTimeout(function(){try{el.classList.remove('agindo');}catch(e){}},900);}catch(e){}
  },true);
}catch(e){}})();

  /* [fotos D1] os grupos (nota/venda/troca) também ganham túmulo, para a foto do comprovante ter rastro */
  const gids=[...new Set(movs.flatMap(x=>[x.notaId?'nota:'+x.notaId:null,x.vendaId?'venda:'+x.vendaId:null,x.trocaId?'troca:'+x.trocaId:null].filter(Boolean)))];

/* Detector de origem: pra venda sem vínculo, acha o pedaço Vendido ÓRFÃO que bate por

function fragOrfao(x){if(x.tipo!=='COMPRA'||sitDe(x)!=='Vendido')return false;
  if(movs.some(v=>v.tipo==='VENDA'&&v.origemId===x.id))return false;
  if(x.vendaRef&&movs.some(v=>v.id===x.vendaRef))return false; /* dono gravado na criação (determinístico) */
  /* legado sem vendaRef: se o nº de vendas apontando pro PAI cobre o nº de pedaços Vendido,
     todo pedaço tem candidato a dono (mesmo que edição tenha quebrado data/qtd) — não é órfão.
     Comparar por heurística de data/qtd aqui gerava falso-órfão e custo DUPLICADO. */
  if(x.loteOrigem){
    const vendasPai=movs.filter(v=>v.tipo==='VENDA'&&v.origemId===x.loteOrigem).length;
    const pedacosVend=movs.filter(y=>y.tipo==='COMPRA'&&y.loteOrigem===x.loteOrigem&&sitDe(y)==='Vendido'&&!y.vendaRef&&!movs.some(v=>v.tipo==='VENDA'&&v.origemId===y.id)).length;
    if(vendasPai>=pedacosVend)return false;}
  return true;}

/* O LOTE inteiro (o "inteiro e o picado"): da raiz da compra, todos os pedaços e o destino
   de cada um — mata a confusão "só vejo o picado, cadê a compra original?". */
/* DIAGNÓSTICO DE LOTE COM CONTA QUEBRADA (Felype 2026-08-12).
   Antes: a prova real dizia "a soma dos pedaços difere do valor original" e parava aí — ele leu
   e me perguntou "que pedaços? onde está o erro?". Aviso que acusa e não mostra o culpado obriga
   o dono a virar detetive do próprio app.
   Caso real que originou (ABBYs eyes · Booster Box): uma caixa de OUTRA nota (R$739,50, nota
   própria com "0 produtos") estava grudada como pedaço do lote de 2 caixas. Efeitos em cascata:
   o app dividia o valor da nota de 2 caixas por 3 partes (lacradas com R$985,99, boosters com
   R$493,00) e a intrusa aparecia como "saiu em troca" sem nenhuma troca ter existido.
   COMO ACHA O CULPADO: procura UM pedaço cuja retirada faz a soma bater com o valor original.
   Se existe e ele tem nota própria / não tem venda ligada / não tem filhos, é intruso — entrou
   por engano. Prova no caso real: 985,99 + 197,20 + 295,80 = 1.478,99 exato. */
function diagLote(raizId){
  const raiz=movs.find(x=>x.id===raizId); if(!raiz) return null;
  const fam=movs.filter(x=>x.tipo==='COMPRA'&&(raizDe(x)||x).id===raizId);
  const ref=raiz.valorOrig!=null?Math.round((+raiz.valorOrig)*100)/100:null;
  if(ref==null||fam.length<2) return null;
  /* [CORRIGIDO 2026-08-13] a soma daqui divergia da regra que a prova real e o "aceitar
     referência" já usavam: caixa ABERTA cujo valor foi redistribuído nos pedaços (filhos de
     abertura) não pode contar de novo — contar os dois é dupla contagem e gerava alarme
     falso neste diagnóstico depois de uma correção de "mesma compra". Mesma exclusão das
     linhas irmãs (provaReal/aceitarConservacao). */
  const filhosD=mapaFilhosCompra();
  const soma=Math.round(fam.reduce((s,x)=>caixaRedistribuida(x,filhosD)?s:s+(+x.valor||0),0)*100)/100;
  if(Math.abs(soma-ref)<=0.02) return null;                       // conta fecha, nada a diagnosticar
  const suspeitas=fam.filter(x=>x.id!==raizId).filter(x=>
    Math.abs(Math.round((soma-(+x.valor||0))*100)/100-ref)<=0.02  // tirando ela, fecha
    && !movs.some(v=>v.tipo==='VENDA'&&v.origemId===x.id)         // sem venda pendurada
    && !movs.some(y=>y.loteOrigem===x.id));                       // sem pedaços próprios
  return {raiz,fam,ref,soma,dif:Math.round((soma-ref)*100)/100,intrusa:suspeitas.length===1?suspeitas[0]:null,ambiguo:suspeitas.length>1};
}
/* HISTÓRICO 2026-08-12, mesmo dia: nasceu simples (só solta a intrusa). Ganhou depois um recurso
   pra "levar os pedaços que saíram dela" — pareceu resolver o caso real do Felype (12+18 boosters
   presos na nota errada), mas o TESTE ISOLADO (fixture sintético, sem tocar dado real — depois do
   susto de mais cedo, testar contra o app aberto está proibido) revelou que a correção era falsa:
   mover os pedaços sem REDISTRIBUIR o valor deles cria uma conta que fecha no papel mas continua
   com números errados dentro — maquiagem, não conserto. Redistribuir valor de verdade precisa do
   preço por unidade da nota CERTA, que é um trabalho à parte, com mais cuidado, não escondido
   dentro de um botão de "soltar". Revertido pra versão simples e PROVADA: 985,99+197,20+295,80=
   1.478,99 exato, sem tocar valorOrig de ninguém. */
function soltarIntrusa(raizId){
  const d=diagLote(raizId); if(!d||!d.intrusa) return;
  const x=d.intrusa;
  const rot=(x.colecao?x.colecao+' · ':'')+(x.cat||'item');
  if(!confirm('Soltar "'+rot+'" ('+(+x.qtd||1)+' un · '+fmt(+x.valor||0)+') deste lote?\n\n'+
    'Ela vira uma compra independente, com o valor dela intacto, e volta pro estoque'+
    (sitDe(x)==='Trocado'?' (hoje está marcada como TROCADA sem troca registrada)':'')+'.\n\n'+
    'Depois disso a conta do lote fecha: '+fmt(d.soma-(+x.valor||0))+' = '+fmt(d.ref)+'.\n\n'+
    'Nada é apagado. Dá pra desfazer refazendo o vínculo.'))return;
  delete x.loteOrigem;
  if(sitDe(x)==='Trocado'){const tidX=x.trocaId;x.situacao='Em estoque';x.destino='Vender';delete x.dataTroca;delete x.trocaId;delete x.origemPedido;enterraGruposVazios([{trocaId:tidX}]);} /* [CORRIGIDO — M-1] mesmo fantasma, mesma limpeza */
  else if(sitDe(x)==='Em estoque')delete x.origemPedido; /* [CORRIGIDO 2026-09-15, 5ª rodada — M-2] a limpeza acima só cobria o ramo Trocado; a peça podia chegar aqui JÁ 'Em estoque' com o fantasma de sobra. Nunca limpa em 'Coleção' — aí ainda não confirmou de verdade, e limpar seria o erro contrário. */
  if(x.valorOrig==null)x.valorOrig=+x.valor||0;

/* MESMA COMPRA — a segunda saída do diagnóstico (Felype 2026-08-13, caso real ABBYs eyes:
   a peça "intrusa" NÃO era de outra compra — a compra verdadeira era de 3 caixas e foi
   lançada errada como 2+1; a 3ª ainda apareceu como "saiu em troca" sem troca existir).
   O app só oferecia "soltar" (separar); faltava o caminho oposto. Regra dele, literal:
   "se dá opção pra um lado, tem que dar pro outro — o programa nunca pode induzir".
   IMPORTANTE (checagem dele, mesma data): marcar a caixa como "Aberta" NÃO manda nada pra
   coleção — "Aberta" é só o rótulo da caixa que virou pedaços; o destino de cada pedaço
   fica exatamente como está (estoque continua estoque pra vender, vendido continua vendido).
   A conta: o valor dos pedaços volta pra raiz (tinha sido cavado do lugar errado), a caixa
   redistribui o próprio valor nos pedaços por unidade (resíduo no último, nunca perde
   centavo), a referência da compra vira a soma verdadeira, e o custo gravado DENTRO da
   venda de pedaço vendido é atualizado junto — senão o lucro continuaria contado errado. */
function _calcMesmaCompra(raizId){
  const d=diagLote(raizId); if(!d||!d.intrusa) return null;
  const raiz=d.raiz,x=d.intrusa;
  /* [CORRIGIDO 2026-08-13, revisão adversarial com prova executada] pedaço que tem FILHOS
     próprios (ex.: porção 'Aberto' de uma caixa da própria raiz, fluxo normal do app) entrava
     na redistribuição — o valor dele era reescrito enquanto os filhos mantinham o antigo,
     quebrando a conservação (soma 2.236,14 vs ref 2.218,49 no cenário de teste) SEM culpado
     achável depois. Mesma guarda que o diagnóstico já usa pras suspeitas. */
  const pecas=d.fam.filter(p=>p.id!==raiz.id&&p.id!==x.id&&p.loteOrigem===raiz.id&&(p.cat||'')!==(raiz.cat||'')&&!movs.some(y=>y.loteOrigem===p.id));
  if(!pecas.length) return null;
  const unTot=pecas.reduce((s,p)=>s+(+p.qtd||1),0);
  if(unTot<1) return null;
  const vUn=Math.round((+x.valor||0)/unTot*100)/100;
  let acum=0;
  const linhas=pecas.map((p,i)=>{
    const nv=i===pecas.length-1?Math.round(((+x.valor||0)-acum)*100)/100:Math.round(vUn*(+p.qtd||1)*100)/100;
    if(i<pecas.length-1)acum=Math.round((acum+nv)*100)/100;
    return {p,novo:nv};
  });
  const devolvido=Math.round(pecas.reduce((s,p)=>s+(+p.valor||0),0)*100)/100;
  return {raiz,x,linhas,vUn,unTot,
    raizNovo:Math.round(((+raiz.valor||0)+devolvido)*100)/100,
    refNova:Math.round((d.ref+(+x.valor||0))*100)/100,
    refAtual:d.ref};
}

function aplicarMesmaCompra(raizId){

function idbOpen(cb){if(_idb){cb(_idb);return;}try{const rq=indexedDB.open('tcg_fotos',3);

/* ===== [1MB fase 1] miniaturas na nuvem, FORA do documento =====
   Doc `th_{movId}` na subcoleção `fotos`: {t:1,th,ts}. Sem campo movId e sem b64 de propósito —
   lerFotos filtra por movId real (nunca acha o doc de thumb) e a busca de thumbs filtra por t==1
   (nunca traz foto inteira). Falha NUNCA trava nada: pendência fica em tcg_th_pend e tenta de novo
   no próximo despacho (login, salvamento, próxima escrita de thumb). */
function thumbsRefNuvem(){try{return (_db&&typeof _db.collection==='function')?_db.collection('controle').doc('dados').collection('fotos'):null;}catch(e){return null;}}   /* _db meio-inicializado nao explode: pendencia espera */
function thumbPend(){try{return JSON.parse(localStorage.getItem('tcg_th_pend')||'{}')||{};}catch(e){return {};}}
function thumbPendGrava(p){try{return gravaLocal('tcg_th_pend',JSON.stringify(p))!==false;}catch(e){return false;}}   /* [revisor 1MB, M4] passa pela escada de poda/aviso do gravaLocal — memoria cheia nunca e calada */
function thumbNuvem(movId,th){if(!movId||!USAR_NUVEM)return;const p=thumbPend();p[movId]=th||null;thumbPendGrava(p);despachaThumbs();}
let _thDespachando=false;
function despachaThumbs(){if(_thDespachando||!USAR_NUVEM)return;const ref=thumbsRefNuvem();if(!ref)return;
  const p=thumbPend(),ks=Object.keys(p);if(!ks.length)return;_thDespachando=true;
  const um=i=>{if(i>=ks.length){_thDespachando=false;return;}
    const id=ks[i],th=p[id];
    const fim=()=>{const q=thumbPend();
      if(q[id]===th)delete q[id];   /* [revisor 1MB, M1] a pendência mudou DURANTE o voo (ex.: apagar entrou no meio)? fica — o próximo despacho envia o valor novo, nada é engolido */
      if(!thumbPendGrava(q)){_thDespachando=false;return;}   /* [M3] memória cheia: para a rodada em 1 escrita — sem re-envio infinito por salvamento */
      um(i+1);};
    const deuRuim=()=>{_thDespachando=false;};   /* pendência fica; próximo despacho retenta */
    try{
      if(th)ref.doc('th_'+id).set({t:1,th,ts:Date.now()}).then(fim).catch(deuRuim);
      else ref.doc('th_'+id).delete().then(fim).catch(deuRuim);
    }catch(e){deuRuim();}};   /* throw síncrono (conexão meio-morta) NUNCA derruba quem chamou — a gravação principal vem antes da miniatura */
  um(0);}

function carregarThumbsNuvem(){if(_thBuscou||!USAR_NUVEM)return;const ref=thumbsRefNuvem();if(!ref)return;

    let mudou=false;(movs||[]).forEach(m=>{if(m&&m.id&&(!m.fotoThumb||m.fotoThumb===TH_MARCA)&&(+m.nFotos||0)>0&&t[m.id]){m.fotoThumb=t[m.id];mudou=true;}});

function fotoComprime(file,cb,perfil){const rd=new FileReader();rd.onload=e=>{const img=new Image();img.onload=()=>{

     ler números") sai com mais definição que foto de carta: 2000px/0,75 com teto de ~900 KB (o documento de
     foto na nuvem tem 1 MiB); se estourar, volta ao perfil da carta (1280px/0,72). */
  if(perfil==='doc'){const d=faz(2000,0.75);cb(d.length>900000?faz(1280,0.72):d);return;}

function fotoMove(f,destinoId,cb){if(!f||!f.id||!f.b64||!destinoId){cb&&cb(false);return;}

/* move TODAS as fotos de um id (grupo ou item) para outro — fusão de notas, desfazer nota movendo pro 1º produto.

/* [revisão F2, G1/G2] cb(n,total): n = fotos que chegaram E saíram da origem; total = quantas havia. null = não
   consegui ler. Quem chama só conclui o gesto do dono (desfazer/tirar da nota/fundir) com n===total; parcial ou
   zero AVISA e não conclui. Sem rede o set fica pendurado — 8 s sem resposta devolve o parcial (mesmo padrão do
   aplicarFotosPend). `_moveEmVoo` barra a mesma foto ser enfileirada duas vezes se ele repetir o gesto. Gesto que

let _moveEmVoo=new Set(),_movesPendentes=[];

function moverFotosDe(origemId,destinoId,cb){if(!origemId||!destinoId||origemId===destinoId){cb&&cb(0,0);return;}
  fotoList(origemId,L=>{if(L===null){cb&&cb(null,0);return;}const fila=L.filter(f=>!_moveEmVoo.has(f.id));if(!fila.length){cb&&cb(0,L.length);return;}

    fotoList(destinoId,D=>{const jaLa=new Set((D||[]).map(x=>x.b64));
      let n=0,falta=fila.length,respondeu=false;const total=L.length;
      const fim=()=>{if(respondeu)return;respondeu=true;const m=movs.find(x=>x.id===destinoId);
        if(m&&n){m.nFotos=(+m.nFotos||0)+n;if(!thumbReal(m.fotoThumb)&&fila[0]&&fila[0].b64){fotoThumbDe(fila[0].b64,t=>{if(t&&!thumbReal(m.fotoThumb)){m.fotoThumb=t;thumbNuvem(m.id,t);}save();});}else save();}
        cb&&cb(n,total);};
      fila.forEach(f=>{_moveEmVoo.add(f.id);
        if(jaLa.has(f.b64)){fotoDel(f.id,ok2=>{_moveEmVoo.delete(f.id);if(ok2)n++;if(--falta===0)fim();});return;}
        fotoMove(f,destinoId,ok=>{_moveEmVoo.delete(f.id);if(ok)n++;if(--falta===0)fim();});});

/* [re-checagem F2, medio 3] a fila de retomada vai para o disco (tcg_moves_pend) — fechar o app não cancela a promessa

function gravaMovesPend(){try{gravaLocal('tcg_moves_pend',JSON.stringify(_movesPendentes));}catch(e){}}
function retomarMovesPendentes(){if(!_movesPendentes.length)return;
  /* [F5 fatia 1 — defeito real da F2 achado agora] com nuvem ligada e SEM login, o fotoList cai no armazenamento
     LOCAL (vazio), devolve "0 de 0" e o gesto concluía sem mover nada — túmulo marcado com o comprovante parado.
     Sem login, a retomada espera o commit (que só existe logado). */
  if(USAR_NUVEM&&!_db)return;
  const fila=_movesPendentes.slice();_movesPendentes=[];gravaMovesPend();

function rotMoverFoto(d){return `${d.jogo&&d.jogo!=='Pokémon'?'['+d.jogo+'] ':''}${(d.obs||((d.colecao?d.colecao+' · ':'')+(d.cat||'item'))).slice(0,40)}${d.idioma&&d.idioma!=='—'?' ('+d.idioma+')':''}${(+d.qtd||1)>1?' · '+(+d.qtd||1)+' un':''} — ${d.tipo==='VENDA'?'vendido por ':'custou '}${fmt(+d.valor||0)} · ${dataBRde(d)}`;}
function candidatosMoverFoto(movId,tudo){const m=movs.find(x=>x.id===movId);const out=[],visto=new Set([movId]);

  if(m){const g=gidDe(m);
    if(g){movs.filter(x=>x.id!==m.id&&x[g[0]+'Id']===g[1]).forEach(x=>add(x.id,'🧩 mesma '+g[0]+': '+rotMoverFoto(x)));
      add(g[1],'📎 comprovante da '+g[2]);}}
  else{movs.filter(x=>x.notaId===movId||x.vendaId===movId||x.trocaId===movId).forEach(x=>add(x.id,'↘ item deste grupo: '+rotMoverFoto(x)));}

/* ===== SELECT COM BUSCA (typeahead) — escolher ITEM em lista grande: digita e filtra por
   TODAS as palavras, sem acento/caixa ("pitch tr" acha "Pitch black · Triple"). O ID escolhido
   vive num hidden com o MESMO id que o select antigo usava — quem lê g('f_origem') não muda. */
let _sbDados={};
function sbNorm(s){return (''+(s||'')).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function selBusca(idBase,itens,preSelId,placeholder,onPick){
  _sbDados[idBase]={itens,onPick:onPick||null};
  const pre=itens.find(x=>x.id===preSelId);
  return `<div style="position:relative">
    <input id="${idBase}_q" placeholder="${placeholder||'digite pra filtrar… (ex.: pitch triple)'}" autocomplete="off" value="${pre?pre.rot.replace(/&/g,'&amp;').replace(/"/g,'&quot;'):''}" oninput="sbFiltra('${idBase}')" onfocus="sbFiltra('${idBase}')">
    <input type="hidden" id="${idBase}" value="${pre?pre.id:''}">
    <div id="${idBase}_dd" style="display:none;position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--card);border:1px solid var(--inpb);border-radius:10px;max-height:260px;overflow:auto;box-shadow:0 8px 22px rgba(0,0,0,.35)"></div></div>`;}
function sbFiltra(idBase){const d=_sbDados[idBase];if(!d)return;
  const qEl=document.getElementById(idBase+'_q'),dd=document.getElementById(idBase+'_dd'),hid=document.getElementById(idBase);
  if(!qEl||!dd)return;
  const q=sbNorm(qEl.value);
  /* digitou por cima = desfez a escolha — o hidden zera até um novo toque na lista */
  if(hid){const atual=d.itens.find(x=>x.id===hid.value);if(!atual||sbNorm(atual.rot)!==q)hid.value='';}
  const termos=q.split(/\s+/).filter(Boolean);
  const hits=termos.length?d.itens.filter(x=>{const r=sbNorm(x.rot);return termos.every(t=>r.includes(t));}):d.itens;
  const MAX=40;
  dd.innerHTML=hits.slice(0,MAX).map(x=>`<div style="padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:13px" onmousedown="sbPick('${idBase}','${x.id}')">${x.rot.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('')
    +(hits.length>MAX?`<div style="padding:8px 12px;color:var(--mut);font-size:11px">+${hits.length-MAX} escondidos — continue digitando pra afinar</div>`:'')
    +(hits.length?'':'<div style="padding:10px 12px;color:var(--mut);font-size:12px">nada com esse texto — confira a grafia ou apague pra ver tudo</div>');
  dd.style.display='block';}
function sbPick(idBase,id){const d=_sbDados[idBase];if(!d)return;const x=d.itens.find(y=>y.id===id);if(!x)return;

  if(hid)hid.value=id;if(qEl)qEl.value=x.rot;if(dd)dd.style.display='none';

function entraNoComprei(m){if(!m||m.tipo!=='COMPRA')return false;const s=sitDe(m);return s!=='Trocado'&&s!=='Aberto';}

   motor (Painel) e pelo rodape de Consulta > Vendas. Quando a soma exata cai em meio centavo (Pitch black: 13.456,625), a ordem da soma

   por isso devolve quantos entraram (comN) e quantos ficaram de fora (semN), honesto sobre
   cobertura parcial. */
/* VALOR DE MERCADO — REGRA DO FELYPE 2026-08-12: NUNCA considerar zero.
   Cascata, nesta ordem:
     1) preço ATUAL da Liga (mesmo que esteja ABAIXO do custo — ele foi explícito: "se o valor
        atual for menor do que o custo, tudo bem, entra o valor atual");
     2) ÚLTIMO preço já visto na Liga (caso da carta que saiu do site: "ele não pode marcar como
        zero; o valor que vai ficar é o último valor achado na Liga");
     3) o CUSTO de aquisição ("se não tem informação do valor atual, considera no mínimo o custo").
   Antes desta correção a função simplesmente IGNORAVA o item sem preço, o que fazia o card
   mostrar um total que parecia o valor da coleção mas era o de um punhado de cartas. */
function ultimoPrecoLigaDe(cod){
  const h=(_precosLiga&&_precosLiga.historico)?(_precosLiga.historico[(''+cod).trim()]||_precosLiga.historico[codLimpo(cod)]):null;
  if(!h)return null;
  let melhorD='',preco=null;
  Object.values(h).forEach(serie=>{if(!Array.isArray(serie))return;
    serie.forEach(p=>{if(p&&p.d&&p.d>=melhorD&&(p.md!=null||p.mn!=null)){melhorD=p.d;preco=(p.md!=null?p.md:p.mn);}});});
  return preco;
}
function valorMercadoDe(lista){
  let val=0,comN=0,semN=0,porUltimo=0,porCusto=0;
  lista.forEach(m=>{
    const qtd=(+m.qtd||1);
    const pl=precoLigaDe(m.codigo);
    const vs=(pl&&pl.status!=='AMBIGUO')?ligaVersoes(pl):[];
    const atual=vs.length?(vs[0].md!=null?vs[0].md:vs[0].mn):null;
    if(atual!=null){val+=atual*qtd;comN++;return;}
    const ult=m.codigo?ultimoPrecoLigaDe(m.codigo):null;
    if(ult!=null){val+=ult*qtd;porUltimo++;semN++;return;}
    val+=(+m.valor||0);porCusto++;semN++;
  });
  return {val:Math.round(val*100)/100,bruto:val,comN,semN,porUltimo,porCusto};}

function parcelasAlemDoPlano(pg,nP){

function emprestaPeriodo(motivo,aba){if(!_perEmprestado)_perEmprestado={perDe,perAte,perSel,motivo:motivo||'',aba:aba||''};perDe='';perAte='';perSel='tudo';}
function devolvePeriodo(){if(!_perEmprestado)return;perDe=_perEmprestado.perDe;perAte=_perEmprestado.perAte;perSel=_perEmprestado.perSel;_perEmprestado=null;}
function setPer(k){_perEmprestado=null;perSel=k;const h=new Date(),iso=x=>x.toISOString().slice(0,10);
  if(k==='d30'){const a=new Date(h);a.setDate(a.getDate()-30);perDe=iso(a);perAte='';}
  else if(k==='d90'){const a=new Date(h);a.setDate(a.getDate()-90);perDe=iso(a);perAte='';}
  else if(k==='ano'){perDe=h.getFullYear()+'-01-01';perAte='';}
  else{perDe='';perAte='';}render();}
function perRange(k,g){if(g==='ano')return[k+'-01-01',k+'-12-31'];
  if(g==='mes'){const p=k.split('-'),last=new Date(+p[0],+p[1],0).getDate();return[k+'-01',k+'-'+String(last).padStart(2,'0')];}
  if(g==='semana'){const d=new Date(k+'T00:00:00'),e=new Date(d);e.setDate(d.getDate()+6);return[k,e.toISOString().slice(0,10)];}
  return[k,k];}

/* [Felype 22/08 23h] "tem uma lista de 100 itens; como é que eu vou achar onde eu tava?" — o snapshot do
   voltar passa a guardar também o item aberto, a vista, a ordem, os filtros e a ROLAGEM. */
function snap(){let sy=0;try{sy=window.scrollY||window.pageYOffset||0;}catch(e){}
  return {tela,consF,consQ,consMenu,perDe,perAte,perSel,editId,tipoSel,expandId,consVer,consOrd,consJogo,consCol,consPess,consConta,consCat,consGrupoFech:Object.assign({},consGrupoFech),scrollY:sy,perEmp:_perEmprestado?Object.assign({},_perEmprestado):null};}
/* [21/08] NAO zere `_fotosItem` aqui. Ele saiu desta linha de proposito: enquanto estava,
   o balde chegava vazio no `guardaBaldeItem` e o aviso "N fotos descartadas" nao saia —

function go(t){navHist.push(snap());if(navHist.length>40)navHist.shift();if(t!=='consultar')devolvePeriodo();if(t==='consultar')consMenu=false;if(t!=='lancar'){_preSel=null;_fotosPend=[];_lancarDirty=false;_pendVolta=null;}selMode=false;selIds={};tela=t;editId=null;render();}

/* Busca por digitação da Consulta (Felype 2026-08-12). Dois cuidados que fazem a diferença
   entre funcionar e ser inutilizável no celular:
   1) render() recria a tela inteira — sem devolver o foco e a posição do cursor, o teclado
      fecharia a cada letra digitada;
   2) espera de 200ms antes de refiltrar, pra não recalcular a lista a cada tecla em quem tem
      centenas de lançamentos. */
let _buscaT=null;
function buscaCons(el){
  const v=el.value,pos=el.selectionStart;
  consQ=v;expandId=null;
  clearTimeout(_buscaT);
  _buscaT=setTimeout(()=>{
    render();
    const n=document.getElementById('consBusca');
    if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
  },200);
}

function selOpts(lista,val){return `<option value="">— selecionar —</option>`+lista.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')+`<option value="__add__">➕ adicionar novo…</option>`;}
function selColOpts(jogo,val){const lista=colsDe(jogo);const semG=[],porG={};
  lista.forEach(c=>{const g=grupoDe(jogo,c);if(g)(porG[g]=porG[g]||[]).push(c);else semG.push(c);});
  const gks=Object.keys(porG).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true}));
  const op=c=>`<option ${c===val?'selected':''}>${c}</option>`;
  return `<option value="">— selecionar —</option>`+gks.map(g=>`<optgroup label="📁 ${g}">${porG[g].map(op).join('')}</optgroup>`).join('')+semG.map(op).join('')+`<option value="__add__">➕ adicionar novo…</option>`;}

/* Rateio de um valor extra (frete OU taxa) proporcional ao produto de cada item, com o
   RESÍDUO de arredondamento absorvido no último — Σ rateios = extra EXATO (classe do
   antipadrão 31: arredondar cada item separado deixava a soma divergir uns centavos). */
function ratearExato(extra,valores){const tot=valores.reduce((s,v)=>s+v,0);if(!(extra>0)||!(tot>0))return valores.map(()=>0);

  let acum=0;return valores.map((v,i)=>{if(i===valores.length-1)return Math.round((extra-acum)*100)/100;

/* ================= FLUXO DE ESTOQUE (linha do tempo dinheiro+estoque, skill 21) =================
   So mostra o que o PAINEL ja tem — sem forms novos, sem campo novo, so leitura/derivacao de `movs`.
   Convencao de data: caixa FISICO — cada evento move o estoque na PROPRIA data dele (chegada real,
   venda real), nunca na data de emissao/compra. Mesma logica que ja existe em duas fontes (motor()
   e fluxoBuckets()) — aqui so falta a forma CUMULATIVA (serie que anda no tempo), que nenhuma das
   duas fornece hoje: motor() so da o total de HOJE; fluxoBuckets() da fluxo POR PERIODO (entrou/saiu
   no bucket), nao saldo acumulado. */
function serieEstoque(){
  /* Exit sai sempre do lado da COMPRA (m.valor/m.dataSaida), nunca pareando com o custoOrigem
     da VENDA -- mudarSit() deixa marcar 'Vendido' SEM criar venda nenhuma, entao pareamento
     pelo lado da venda perdia a saida pra pecas marcadas assim. Cada registro de compra e
     autocontido (entrada e saida do MESMO m.valor).

     Skip de Colecao por CURRENT sitDe (nao por destIni) -- destIni e fixado na compra e
     mudarSit() pode levar o item de volta a 'Em estoque' sem limpar destIni='Coleção' (item
     que passou por Colecao e voltou pro estoque nao pode ficar excluido pra sempre, motor()
     conta ele). Mas pra quem SAIU (Vendido/Trocado/Aberto), destIni ainda importa: um item
     que NASCEU pra colecao e foi vendido direto NUNCA passou por estoque de revenda (motor()
     tambem nunca contou -- ficava em colCusto, nunca em estoque), e so destIni sabe disso,
     porque sitDe atual já é 'Vendido' pros dois casos (achado real, rodada de revisao
     2026-09-15: 1 item assim no backup real virava estoque-fantasma).

     Pre-venda (vendido sem nunca ter chegado, 'Pedido' -> 'Vendido' direto) exige DOIS
     caminhos: venda INTEGRAL (origemId==m.id direto) e venda PARCIAL (baixarLote mantem o id
     ORIGINAL no lote que sobra e cria um id NOVO pro pedaco vendido, que so e identificavel
     pelo `vendaRef` gravado NELE). Quando a venda referenciada nao existe mais (vinculo
     quebrado por sync/exclusao externa -- o app já tem diagnostico próprio pra essa classe,
     "referência de venda quebrada") E o item nunca teve dataChegada, NAO dá pra confirmar que
     passou por estoque de verdade -- tratar como pré-venda (exclui) é o lado seguro: a
     alternativa (assumir venda normal) inflava a curva com um fantasma idêntico ao da
     pré-venda de verdade (achado real, 2 casos pequenos no backup: R$140,55 e R$6,90).

     Baixa SEM dataSaida (mudarSit() nao grava essa data; dado legado/importado tambem não
     tem) NÃO ENTRA NA CURVA -- nem entrada nem saída. [CORRIGIDO 2026-09-15, rodada de
     revisão: a versão anterior aproximava a saída para "hoje", e isso criava um DEGRAU FALSO
     de ~R$29-31mil bem na borda direita do gráfico (todas as baixas sem data cambiam no MESMO
     ponto) -- pior que o bug original (que achatava pra zero): esse inflava a parte mais
     lida do gráfico. Não existe data melhor pra "inventar" (no backup real, 12 de 13 baixas
     sem data também não têm venda vinculada pra recuperar a data por outro caminho) -- o
     honesto é NÃO desenhar o que não se sabe quando aconteceu, e avisar contado (semData/
     semDataValor) que esse tanto já saiu do estoque de hoje, só sem data certa de quando.
     O endpoint (estoque de HOJE) continua batendo com motor() porque nem entra nem sai --
     contribui zero em qualquer ponto da curva, igual motor() já trata (não conta em estoque
     nem em pedido nem em colCusto depois de Vendido). */
  const evs=[];
  let semData=0,semDataValor=0;
  movs.forEach(m=>{
    if(m.tipo!=='COMPRA')return;
    const s=sitDe(m);
    if(s==='Pedido'||s==='Coleção')return; /* pedido: motor().pedido; colecao: motor().colCusto */
    const di=m.destIni||((s==='Coleção'&&!m.loteOrigem)?'Coleção':'Em estoque');
    if((s==='Vendido'||s==='Trocado'||s==='Aberto')&&di==='Coleção')return; /* nasceu p/ colecao — nunca foi estoque de revenda, mesmo vendido/trocado depois */
    if(s==='Vendido'){
      const vFull=movs.find(v=>v.tipo==='VENDA'&&v.origemId===m.id);
      const vPart=m.vendaRef?movs.find(v=>v.id===m.vendaRef):null;
      const venda=vFull||vPart;
      /* sem venda achavel (vinculo quebrado): so confia se ja tem chegada confirmada por outra via */
      const eraPedido=venda?venda.vendaDe==='pedido':!m.dataChegada;
      if(eraPedido){
        if(!m.dataChegada)return; /* pré-venda ainda não confirmada como chegada — nunca esteve em estoque de verdade */
        /* CONFIRMADA depois de já vendida (`chegouPeca`, pedido do Felype 2026-09-15: cada peça
           pré-vendida pede confirmação própria de chegada): entra e sai no MESMO dia da chegada —
           NUNCA no `dataSaida` original, que é a data da VENDA e vem ANTES da chegada por
           definição (inverteria a ordem entrada/saída e criaria um mergulho falso na curva).
           Contribuição líquida zero, mas datada no dia certo — é exatamente "chegou e já tinha
           dono", não estoque disponível em nenhum momento. */
        evs.push({data:m.dataChegada,delta:+m.valor||0});
        evs.push({data:m.dataChegada,delta:-(+m.valor||0)});
        return;
      }
    }
    const dEntrada=m.dataChegada||m.data;
    if(!dEntrada)return; /* sem data nenhuma p/ entrada — nao da p/ posicionar na linha do tempo */
    if(s==='Vendido'||s==='Trocado'||s==='Aberto'){
      if(!m.dataSaida){semData++;semDataValor+=(+m.valor||0);return;} /* sem data de saída confiável — não entra na curva, só no aviso */
      /* [CORRIGIDO 2026-09-15, 4ª rodada de revisão — M-3, mesma classe já corrigida na pré-venda
         (linhas acima) mas que sobrevivia aqui: dataChegada/data podem vir depois de dataSaida
         por edição manual (corrigir a data da compra depois de já ter vendido, por exemplo) —
         sem o clamp, a saída desenhava ANTES da entrada. */
      const dEntradaClampada=dEntrada>m.dataSaida?m.dataSaida:dEntrada;
      evs.push({data:dEntradaClampada,delta:+m.valor||0});
      evs.push({data:m.dataSaida,delta:-(+m.valor||0)});
    } else {
      evs.push({data:dEntrada,delta:+m.valor||0});
    }
  });
  evs.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);

function serieDinheiro(){

  let proxIdObj=1;const idsPgParcelas=new WeakMap();
  const idDoObjeto=o=>{if(!idsPgParcelas.has(o))idsPgParcelas.set(o,proxIdObj++);return idsPgParcelas.get(o);};
  const slotsVistos=new Set();
  const notasVistas=new Set();
  movs.forEach(m=>{
    if(m.tipo==='VENDA'){
      if(m.data)evs.push({data:m.data,delta:(+m.valor||0)*(1-(+m.taxa||0)/100)});
    } else if(m.tipo==='COMPRA'){
      if(m.origem)return; /* troca/abertura: dinheiro já contado na compra original ou tem campo próprio (m.din) — fora deste modelo simples */
      if(m.pgTipo==='Parcelado'&&+m.nParc>0){
        let nP,vParc,pg;
        if(m.notaId){
          /* nota: UM cronograma pela cabeça, igual aPagar()/contasPagas()/saldoConta -- nunca por item */
          if(notasVistas.has(m.notaId))return;
          notasVistas.add(m.notaId);
          const itens=movs.filter(x=>x.tipo==='COMPRA'&&!x.origem&&x.notaId===m.notaId&&x.pgTipo==='Parcelado'&&+x.nParc>0); /* [CORRIGIDO 2026-09-15, 6ª rodada — G-A] faltava o filtro que a irmã saldoFisicoConta (linha ~4021) já tem e cujo comentário nomeia este exato defeito: item da nota editado pra à vista fica fora da nota-de-parcela e some da cabeça errada, deslocando qual item vira `h` */
          const h=itens[0];

        } else {
          nP=+m.nParc||1;vParc=(+m.valor||0)/nP;pg=m.pgParcelas;
        }
        for(let i=1;i<=nP;i++){
          /* sem pgParcelas: a chave usa o ID desta peça/cabeça (nunca compartilhada); com
             pgParcelas: a chave usa a IDENTIDADE do objeto (dois pedaços que ainda apontam pro
             MESMO objeto — pagamento registrado ANTES do fracionamento — contam uma vez só). */
          const chave=(pg?idDoObjeto(pg):(m.notaId||m.id))+':'+i;
          if(slotsVistos.has(chave))continue;

           e vira aviso contado (pagasAlem), nunca absorvido em silêncio; mesma regra de dedupe. */
        parcelasAlemDoPlano(pg,nP).forEach(({k,p})=>{
          const chave=(pg?idDoObjeto(pg):(m.notaId||m.id))+':'+k;
          if(slotsVistos.has(chave))return;

          evs.push({data:pgData(p),delta:-v});pagasAlem++;pagasAlemValor+=v;
        });
      } else if(m.data){
        evs.push({data:m.data,delta:-(+m.valor||0)});
      }
    } else if(m.tipo==='DESPESA'){
      if(m.status==='pago'){const d=m.dataPagamento||m.data;if(d)evs.push({data:d,delta:-(+m.valor||0)});}
    }
  });
  evs.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);
  let tot=0;const porDia={};
  evs.forEach(e=>{tot+=e.delta;porDia[e.data]=Math.round(tot*100)/100;});
  const serie=Object.keys(porDia).sort().map(d=>({data:d,total:porDia[d]}));
  serie.semPagar=semPagar;serie.semPagarValor=Math.round(semPagarValor*100)/100;
  serie.pagasAlem=pagasAlem;serie.pagasAlemValor=Math.round(pagasAlemValor*100)/100;

   (`origemPedido` sem `dataChegada`) não entra ainda -- só quando `chegouPeca` confirma, igual já
   vale pro lado do estoque; saída sem `dataSaida` vira aviso (semData/semDataValor), nunca "hoje"

function serieColecao(){

  serie.semChegada=semChegada;serie.semChegadaValor=Math.round(semChegadaValor*100)/100;

  const avisoAlem=(verCaixa&&serieDin.pagasAlem)?`<div class="meta" style="color:var(--amber)">⚠ ${serieDin.pagasAlem} parcela${serieDin.pagasAlem>1?'s':''} paga${serieDin.pagasAlem>1?'s':''} a mais do que o plano da compra (${fmt(serieDin.pagasAlemValor)}). Esse dinheiro está contado aqui. Acontece quando o nº de parcelas é reduzido depois de já ter pago — acerte no Diagnóstico.</div>`:'';

  if(verColecao)legItens.push('<span><span style="display:inline-block;width:12px;height:2px;background:var(--purple);vertical-align:middle;margin-right:4px;border-top:2px dotted var(--purple)"></span>coleção</span>');

  if(qtdStr===null)return;

     `!qtd` impossível de disparar (M1) -- número inválido (0/negativo/texto) virava 1 em
     silêncio em vez de avisar. Agora valida o número CRU antes de limitar ao disponível. */
  const qtdRaw=Math.round(+qtdStr);
  if(!qtdRaw||qtdRaw<1){alert('Quantidade inválida.');return;}
  const qtd=Math.min(qtdRaw,dispQ);
  const peca=baixarLote(id,qtd,'Coleção',{origemPedido:true});
  if(!peca){alert('Não consegui separar essa quantidade.');return;}
  /* [CORRIGIDO 2026-09-15, rodada de revisão — G3] baixarLote() infere destIni pelo sitDe
     ANTERIOR do lote (aqui, 'Pedido'), então sozinho ele gravaria destIni='Em estoque' --
     errado: esta peça nunca foi estoque de revenda de verdade, foi de pedido direto pra
     coleção. Sem sobrescrever, ela fica marcada como se tivesse sido estoque real e, se um
     dia saísse da coleção (venda/troca), inflaria a curva de estoque com um fantasma
     (mesma classe do bug já corrigido uma vez em serieEstoque(), agora nascendo aqui). */
  peca.destIni='Coleção';
  save();diarioReg('separou pedido a caminho p/ coleção',rotDe(peca));toast('Separado pra coleção ✓ — já sai da expectativa de estoque disponível');render();
}
/* Agrupa cada pedido a caminho pela RAIZ do lote (`raizDe`, já existente): uma linha pra parte
   ainda sem comprador (se sobrar), uma por peça já vendida a alguém específico (aguardando
   confirmação de chegada), e uma por peça já separada pra coleção (idem). Reusa o MESMO sinal que
   `serieEstoque()` usa pra reconhecer pré-venda real (venda vinculada por `origemId` OU
   `vendaRef`, com `vendaDe==='pedido'`) — nunca um sinal novo, pra não desalinhar as duas telas.
   [CORRIGIDO 2026-09-15, rodada de revisão — achado 4 da revisão] a versão anterior fazia 2
   passadas: a 1ª montava um Set das raízes "de pedido" e a 2ª só deixava a peça de coleção
   entrar se a raiz dela estivesse no Set — fazia sentido antes do campo `origemPedido` existir
   (quando só se sabia que uma peça de coleção vinha de pedido pela raiz ainda ter irmão em
   'Pedido' ou 'Vendido' não confirmado — exatamente o bug do G1/G2). Com `origemPedido` marcando
   a peça DIRETO na hora da separação (`separarParaColecao`), a condição da 2ª passada tinha
   virado cópia exata da 1ª — nunca reprovava nada, código morto disfarçado de proteção, mesma
   classe do M1. Colapsado numa passada só: cada peça decide por si, sem depender de irmão. */
function pedidosAgrupados(){
  const vendaDe=m=>movs.find(v=>v.tipo==='VENDA'&&v.origemId===m.id)||(m.vendaRef?movs.find(v=>v.id===m.vendaRef):null);
  /* mesmo sinal que serieEstoque() usa (nunca um novo) -- vínculo quebrado (venda não achada)
     trata como pré-venda ainda não confirmada (lado seguro), em vez de simplesmente ignorar
     a peça (M3: antes, vínculo quebrado a tornava invisível AQUI mas ainda excluída LÁ --
     ficava presa sem nunca poder ser confirmada nem contada). */
  const eraPedido=(m,venda)=>venda?venda.vendaDe==='pedido':!m.dataChegada;
  const grupos={};
  const add=(raizId)=>{if(!grupos[raizId])grupos[raizId]={raiz:movs.find(x=>x.id===raizId),remanescentes:[],pecas:[],colecao:[]};return grupos[raizId];};
  movs.forEach(m=>{
    if(m.tipo!=='COMPRA')return;
    const s=sitDe(m);
    if(s==='Pedido'){add(raizDe(m).id).remanescentes.push(m);return;} /* [CORRIGIDO — M2] lista, não campo único: nada nesta estrutura garante um só remanescente por raiz pra sempre */
    if(s==='Vendido'&&!m.dataChegada){
      const venda=vendaDe(m);
      if(eraPedido(m,venda))add(raizDe(m).id).pecas.push({peca:m,venda});
      return;
    }
    if(s==='Coleção'&&!m.dataChegada&&m.origemPedido)add(raizDe(m).id).colecao.push(m); /* origemPedido só nasce em separarParaColecao — coleção vinda de compra NORMAL (CONSUMO) nunca entra aqui */
  });
  return Object.values(grupos);
}
function vEstoque(){

     `situacao==='Pedido'` -- separar o pedido INTEIRO pra coleção (ou pré-vender tudo) zera
     esse número mesmo com a peça ainda pendente e listada bem abaixo (card mostrava R$0,00 com
     item na lista logo embaixo — o que o Felype ia ver e estranhar). O total certo é a soma do

  const totalACaminho=grupos.reduce((s,g)=>s
    +g.remanescentes.reduce((s2,m)=>s2+(+m.valor||0),0)

  const linhaPeca=(id,nome,valor,meta,onclickChegou)=>`<div class="item" style="justify-content:space-between;align-items:center"><div style="cursor:pointer" onclick="abrir('${id}')"><b>${nome}</b><div class="meta">${meta}</div></div><div style="text-align:right;white-space:nowrap"><b>${fmt(valor)}</b><div><button class="x" style="color:var(--green);margin-top:4px" onclick="${onclickChegou}">✓ chegou</button></div></div></div>`;
  const listaGrupos=grupos.length?grupos.map(g=>{

    const linhaRem=g.remanescentes.map(rem=>`<div class="item" style="justify-content:space-between;align-items:center"><div style="cursor:pointer" onclick="abrir('${rem.id}')"><b>Ainda sem comprador</b><div class="meta">comprado ${dataCompra}${rem.contraparte?' · '+rem.contraparte:''}</div></div><div style="text-align:right;white-space:nowrap"><b>${fmt(+rem.valor||0)}</b><div style="display:flex;gap:6px;margin-top:4px;justify-content:flex-end"><button class="x" style="color:var(--amber)" onclick="separarParaColecao('${rem.id}')" title="separar parte pra coleção antes de chegar">⭐ p/ coleção</button><button class="x" style="color:var(--green)" onclick="chegouPedido('${rem.id}')">✓ chegou</button></div></div></div>`).join('');

}

function salvarEdicaoNota(nid){const todos=movs.filter(m=>m.notaId===nid);if(!todos.length)return;

    if(novos.some(x=>x.p<=0)){alert('Todo item precisa de um valor de produto maior que zero.');return;}
    const rF=ratearExato(frete,novos.map(x=>x.p)),rT=ratearExato(taxa,novos.map(x=>x.p));
    const totN=Math.round((novos.reduce((s,x)=>s+x.p,0)+frete+taxa)*100)/100;

function graficoSvg(entDesc,on){const ent=entDesc.slice(0,12).reverse();

  if(!on.length)return '<div class="meta">Ligue ao menos um fluxo acima.</div>';

  ent.forEach(([k,b],i)=>{const cx=padL+i*iw+iw/2;

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">${g}</svg>${legenda}<div class="meta" style="margin-top:5px;text-align:center">últimos ${ent.length} períodos (${relGran==='mes'?'mês a mês':relGran}) · período: ${perRotTxt()} · toque na coluna pra abrir · imprime como está</div>`;}

       de ajuste aqui — o lucro já lê m.valor direto, então uma correção nele já se reflete
       sozinha. Mesma filosofia do bloco de COMPRA acima: corrigir registro é diferente de

    if(e&&e.tipo===obj.tipo&&obj.tipo==='VENDA'&&e.origemId&&e.custoOrigem!=null){

    editId=null;toast('Alteração salva');voltarDaEdicao();return;}
  movs.push(obj);aplicarFotosPend(obj.id);save();diarioReg('lançou',rotDe(obj),obj.tipo);limpaRascunho();_lancarDirty=false;
  /* [revisão C 23/08, M6] venda iniciada numa LINHA da Consultar ("💰 vender" → _preSel) volta para a linha

/* [Felype 2026-08-20] "O APP SALVA AUTOMATICO BACKUP NA NUVEM. MAS O ULTIMO BACKUP EH DE 12/08
   ... E EU NAO CONSIGO PEDIR PARA FAZER NOVO BACKUP NA NUVEM."

const PONTOS_NUVEM_MAX=12;

   Os tres estados existem porque tratar recusa como "lista vazia" fazia a tela dizer "nenhum

   E a dor de 12/08 reencenada, so que pior, porque desta vez com uma tela dizendo que esta tudo
   certo. (Achado da revisao adversarial, 2026-08-20.) */
let _pontosNuvem=null;
function pontosNuvemRef(){return _db?_db.collection('controle').doc('dados').collection('pontos'):null;}
function carregarPontosNuvem(cb){
  const ref=pontosNuvemRef();

  ref.orderBy('ts','desc').limit(30).get().then(q=>{
    const L=[];q.forEach(d=>L.push({ts:+d.id,n:(d.data()||{}).n||0,quem:(d.data()||{}).quem||''}));
    _pontosNuvem=L;if(cb)cb();

   seguranca de fato existiu antes de sobrescrever tudo. A versao anterior chamava isto em modo
   silencioso e seguia em frente sem olhar: os tres caminhos de falha (sem nuvem, dado grande
   demais, recusa) retornavam mudos e o dono perdia o estado atual acreditando no que o aviso
   da tela tinha prometido. */
function salvarPontoNuvem(silencioso,semRotacao){
  const ref=pontosNuvemRef();
  const falha=m=>{if(!silencioso)alert(m);return Promise.resolve({ok:false,motivo:m});};
  if(!ref)return falha('Sem nuvem conectada agora — o ponto na nuvem precisa de internet e login.');
  const ts=Date.now();
  const dados=JSON.stringify({movs,jogos,cats,cols,colsJ,colsG,pess,pgs,despCats,cadastros,contasBanc,codigosResolvidos});
  /* mede BYTES, nao caracteres: o limite do Firestore e 1.048.576 bytes e acento/emoji ocupam
     mais de um byte cada. 700k e a mesma folga que o salvarNuvem ja usa. */
  let bytes=dados.length;
  try{bytes=new TextEncoder().encode(dados).length;}catch(e){}
  if(bytes>700000)return falha('Seus dados passaram do tamanho que cabe num ponto na nuvem. Use "Completo c/ fotos" pra guardar no computador e me avise.');
  if(!silencioso)toast('salvando ponto na nuvem...');

    localStorage.setItem('tcg_ultimo_ponto_nuvem',String(ts));
    if(!silencioso)toast('ponto salvo na nuvem');
    if(semRotacao)return carregarPontosNuvem(()=>{}),{ok:true,ts};
    /* rotacao: mantem os PONTOS_NUVEM_MAX mais recentes. Roda so em salvamento COMUM — nunca
       no pre-salvamento de uma restauracao, senao com as vagas cheias o ponto novo empurrava
       para fora justamente o ponto mais antigo, que costuma ser o alvo da restauracao (e o
       anterior a corrupcao). Restaurar apagava o que se queria restaurar. */
    return ref.orderBy('ts','desc').get().then(q=>{
      const ids=[];q.forEach(d=>ids.push(d.id));
      ids.slice(PONTOS_NUVEM_MAX).forEach(id=>ref.doc(id).delete().catch(()=>{}));
      return new Promise(r=>carregarPontosNuvem(()=>{
        if(!silencioso&&document.getElementById('modal')){fecharModal();abrirBackup();}
        r({ok:true,ts});}));
    }).catch(()=>({ok:true,ts}));
  }).catch(e=>{
    const m='A nuvem recusou o ponto: '+((e&&e.message)||'erro')+' — se falar em permissao, falta liberar "pontos" no Firebase.';
    if(!silencioso)alert(m);
    return {ok:false,motivo:m};});}
function restaurarPontoNuvem(ts){
  const ref=pontosNuvemRef();if(!ref)return;
  if(!confirm('Voltar TODOS os dados para o ponto de '+new Date(ts).toLocaleString('pt-BR')+'? Antes disso eu guardo um ponto com o estado de AGORA, pra dar pra voltar atras.'))return;
  diarioReg('restaurou ponto da nuvem',new Date(ts).toLocaleString('pt-BR'));
  toast('guardando o estado de agora...');
  /* ESPERA o pre-salvamento e SO continua se ele deu certo. Sem isso a frase do aviso era uma
     promessa que o codigo nao cumpria. semRotacao=true protege o alvo (ver G4 acima). */
  salvarPontoNuvem(true,true).then(r=>{
    if(!r||!r.ok){
      alert('NAO restaurei. Nao consegui guardar o estado de agora antes ('+((r&&r.motivo)||'motivo desconhecido')+'), e restaurar sem essa copia poderia te fazer perder o que existe hoje.');
      return;}
    return ref.doc(String(ts)).get().then(d=>{
      if(!d.exists){alert('Esse ponto nao esta mais na nuvem.');return;}
      let o=null;try{o=JSON.parse((d.data()||{}).dados||'null');}catch(e){}

         restaurava (e nada avisava). */
      const baseAntes=_baseH;limpaPendNuvem(_pendSeq);
      aplicarNuvem(o);
      /* [re-checagem 3, N5] aplicarNuvem(o) sem pendência grava a base A PARTIR DO PONTO — que a
         nuvem nunca confirmou. Se a subida (3 s abaixo) falhar, o snapshot seguinte vê
         hash(local)==base ("não mexeram nisto aqui"), o remoto vence e a restauração se desfaz em
         silêncio. Republica a base ANTERIOR: o que o ponto mudou passa a diferir dela → local vence
         → a restauração sobrevive e sobe. (Zerar a base NÃO serve: sem entrada cai no resgate por
         referência e volta a "remoto vence".) */
      publicaBase(baseAntes);

         segura o snapshot de volta, senao a nuvem reaplicava o estado velho por cima em
         silencio — o mesmo estrago mapeado em 2026-08-11 no restaurar local. */
      _restaurando=true;

    });
  }).catch(e=>alert('Nao consegui restaurar: '+((e&&e.message)||'erro')));}

function saldoConta(cb){const hoje=new Date().toISOString().slice(0,10);let s=+cb.saldoIni||0;
  movs.forEach(m=>{
    if(cb.saldoData&&(m.data||'')<cb.saldoData)return;
    /* transferência/aporte e o dinheiro dado em troca usam campos próprios de conta */
    if(m.tipo==='TRANSF'){const v=+m.valor||0;if(m.contaDe===cb.nome)s-=v;if(m.contaPara===cb.nome)s+=v;return;}
    if(m.tipo==='COMPRA'&&m.origem==='TROCA'&&+m.din>0&&m.dinConta===cb.nome){s-=+m.din;return;}
    if((m.conta||'')!==cb.nome)return;
    if(m.tipo==='VENDA')s+=(+m.valor||0)*(1-(+m.taxa||0)/100);
    else if(m.tipo==='COMPRA'&&!m.origem)s-=(+m.valor||0);
    else if(m.tipo==='DESPESA'){if(m.status==='apagar'&&m.data>hoje)return;s-=(+m.valor||0);}});

/* Saldo FÍSICO por conta — o dinheiro que JÁ saiu/entrou de verdade: compra parcelada só
   debita as parcelas PAGAS (na conta do pagamento, quando registrada); venda no app só
   credita depois do prazo de recebimento. É o número do dia a dia — "por emissão" continua
   ao lado, rotulado (regra: convenções diferentes SEMPRE rotuladas, nunca misturadas). */
function saldoFisicoConta(cb){const hoje=new Date();hoje.setHours(0,0,0,0);const hojeISO=new Date().toISOString().slice(0,10);
  let s=+cb.saldoIni||0;
  const pagouDe=(m,pi)=>{const p=(m.pgParcelas||{})[pi];return (p&&typeof p==='object'&&p.conta)?p.conta:(m.conta||'');};
  /* a data-base do saldo inicial corta pela data em que o dinheiro MEXEU (regime caixa):
     parcela = dia do pagamento; venda no app = dia do recebimento — não pela emissão */
  const antesBase=d=>cb.saldoData&&(d||'')<cb.saldoData;

    if(m.tipo==='TRANSF'){if(antesBase(m.data))return;const v=+m.valor||0;if(m.contaDe===cb.nome)s-=v;if(m.contaPara===cb.nome)s+=v;return;}
    if(m.tipo==='COMPRA'&&m.origem==='TROCA'&&+m.din>0&&m.dinConta===cb.nome){if(antesBase(m.data))return;s-=+m.din;return;}
    if(m.tipo==='VENDA'){if((m.conta||'')!==cb.nome)return;
      let dRec=m.data||'';
      if(m.canal==='App'&&+m.recDias>0){const d=new Date((m.data||'')+'T00:00:00');d.setDate(d.getDate()+(+m.recDias||0));if(d>hoje)return;dRec=d.toISOString().slice(0,10);}
      if(antesBase(dRec))return;
      s+=(+m.valor||0)*(1-(+m.taxa||0)/100);return;}
    if(m.tipo==='DESPESA'){if((m.conta||'')!==cb.nome)return;if(antesBase(m.data))return;if(m.status==='apagar'&&(m.data||'')>hojeISO)return;s-=(+m.valor||0);return;}
    if(m.tipo!=='COMPRA'||m.origem)return;
    if(m.pgTipo==='Parcelado'&&+m.nParc>0){
      /* nota parcelada = UM cronograma pela cabeça — MESMO filtro do a-pagar (só itens
